/* Időszakos szokások: heti / havi / éves célszámmal; ezek minden nap kipipálhatók, és az időszak végéig kell elérni a célt */
function isT(h){return h.freq==='weekly'||h.freq==='monthly'||h.freq==='yearly'}
function periodText(h){return{weekly:'Ezen a héten',monthly:'Ebben a hónapban',yearly:'Idén'}[h.freq]}
function periodMax(f){return{weekly:7,monthly:31,yearly:365}[f]||7}
function freqLabel(t){return t.freq==='daily'?'Minden nap':t.freq==='weekly'?`Heti ${t.target}×`:t.freq==='monthly'?`Havi ${t.target}×`:t.freq==='yearly'?`Évente ${t.target}×`:t.days.map(d=>WD[d]).join(', ')}
function periodCount(h,k){if(h.freq==='weekly')return weekCount(h,k);const pre=h.freq==='monthly'?k.slice(0,7):k.slice(0,4);return Object.keys(S.log).filter(x=>x.startsWith(pre)&&x<=k&&S.log[x].includes(h.id)).length}
function scheduledOn(h,d){if(isPaused(keyOf(d)))return false;if(h.freq==='daily'||isT(h))return true;return h.days.includes(wd(d))}
const isDone=(h,k)=>(S.log[k]||[]).includes(h.id);

/* ───────── Szokáskövető a számításokban ─────────
   A napi haladás, a teljesítési arány és a sorozat a szokáslistát ÉS a Szokáskövetőt is figyeli.
   Egy követő attól a naptól számít, amikor először használtad; ha a hozzá tartozó szokás a listádon van
   (Edzés, Meditáció, Bőrápolás), nem számoljuk kétszer. */
let _trkStart=null;
function trackerStarts(s){let main=false;try{main=s===S}catch(e){}if(main&&_trkStart)return _trkStart;
  const mn=a=>a.length?a.reduce((x,y)=>x<y?x:y):null,f=(s.fitness||{}).log||{},sk=(s.skin||{}).log||{};
  const r={fit:mn(Object.keys(f).filter(k=>f[k].done)),mood:mn(Object.keys(s.moods||{})),med:mn((s.med||[]).map(x=>x.date)),
    skin:mn(Object.keys(sk).filter(k=>sk[k].am.length||sk[k].pm.length)),sleep:mn(Object.keys(s.sleep||{}))};
  if(main)_trkStart=r;return r}
function trackerChecks(k,s=S){
  return[];/* A követők már nem jelennek meg külön, ezért a haladás és az arányok csak a szokásokból számolnak */
  if(!s.fitness||!s.skin||k>TODAY)return[];const st=trackerStarts(s),has=n=>s.habits.some(h=>h.name===n),out=[];
  const plan=s.fitness.plan[wd(parseK(k))],f=s.fitness.log[k],lg=s.skin.log[k]||{am:[],pm:[]},sk=s.skin.am.length+s.skin.pm.length;
  if(st.fit&&k>=st.fit&&plan!=='Pihenő'&&!has('Edzés'))out.push(!!(f&&f.done));
  if(st.mood&&k>=st.mood)out.push(!!s.moods[k]);
  if(st.med&&k>=st.med&&!has('Meditáció'))out.push(s.med.some(x=>x.date===k));
  if(st.skin&&k>=st.skin&&sk&&!has('Bőrápolás'))out.push(lg.am.length+lg.pm.length>=sk);
  if(st.sleep&&k>=st.sleep)out.push(!!(s.sleep||{})[k]);
  return out}
function trackerDone(k,s=S){
  if((s.moods||{})[k]||(s.sleep||{})[k])return true;const f=((s.fitness||{}).log||{})[k];if(f&&f.done)return true;
  if((s.med||[]).some(x=>x.date===k))return true;const e=((s.skin||{}).log||{})[k];return!!(e&&(e.am.length||e.pm.length))}
function dayRate(k,s=S){const d=parseK(k);const hs=s.habits.filter(h=>!isT(h)&&scheduledOn(h,d)),tc=trackerChecks(k,s),tot=hs.length+tc.length;if(!tot)return null;return(hs.filter(h=>(s.log[k]||[]).includes(h.id)).length+tc.filter(Boolean).length)/tot}

function cycInfo(k=TODAY){

  else if(type==='crocus'){head=`<path d="M-4.5 ${-H-6}c-.5 5 1.5 7.5 4.5 7.5s5-2.5 4.5-7.5c-1.5 1.5-2.5 1.5-4.5-1.5-2 3-3 3-4.5 1.5z" fill="#D7C3F5"/><path d="M0 ${-H-4}v4" stroke="#F2A65A" stroke-width="1.1"/>`}
  else if(type==='cosmos'){for(let i=0;i<8;i++)head+=`<path d="M0 ${-H}l-2.4 -5.2q2.4 -1.6 4.8 0z" fill="${i%2?'#F7B5CB':'#FBCFDC'}" transform="rotate(${i*45} 0 ${-H})"/>`;head+=`<circle cy="${-H}" r="1.8" fill="#F2C35E"/>`}
  else if(type==='iris'){head=`<path d="M0 ${-H}c-2-4-2-8 0-10 2 2 2 6 0 10z" fill="#9DB4EE"/><path d="M0 ${-H}c-3-1-7 0-8 3 3 1 6 0 8-3zM0 ${-H}c3-1 7 0 8 3-3 1-6 0-8-3z" fill="#7F9BE0"/><path d="M-1 ${-H+.5}h2" stroke="#F6D77A" stroke-width="1.2"/>`}

journal(){

  let body='';

   const dist=MOODS.map(()=>0);Object.keys(S.moods).filter(k=>dayDiff(TODAY,k)<N).forEach(k=>dist[S.moods[k].m]++);const tot=dist.reduce((a,b)=>a+b,0)||1;
   const avg=vals.filter(v=>v.v).reduce((a,b)=>a+b.v,0)/(vals.filter(v=>v.v).length||1);
   body=`<section class="card"><div class="lbl">Mai hangulat</div><div class="moods plain" style="margin-top:10px">${MOODS.map((x,i)=>`<button class="mood-b ${m&&m.m===i?'on':''}" data-a="setMood" data-m="${i}"><span class="e">${x.e}</span>${x.n}</button>`).join('')}</div><div class="field"><label for="mnote">Jegyzet</label><textarea class="inp" id="mnote" placeholder="Mi alakította ma a hangulatodat?">${esc(m&&m.note)}</textarea></div><button class="btn block" style="margin-top:12px" data-a="saveMoodNote">Jegyzet mentése</button></section>
   <div class="row"><h2 class="grow" style="font-size:20px">Hangulat trend</h2><div class="seg" style="width:170px"><button class="${S.ui.seg==='week'?'on':''}" data-a="mseg" data-v="week">Heti</button><button class="${S.ui.seg==='month'?'on':''}" data-a="mseg" data-v="month">Havi</button></div></div>
   <section class="card chart">${moodChart(vals)}<p class="muted" style="margin-top:10px">Átlag: <b style="color:var(--ink)">${MOODS[Math.max(0,Math.min(4,5-Math.round(avg)))].e} ${avg.toFixed(1)}/5</b> az elmúlt ${N} napban</p></section>
   <section class="card"><div class="lbl">Megoszlás</div><div class="cons" style="margin-top:12px">${MOODS.map((x,i)=>({...x,i})).filter(x=>dist[x.i]).sort((a,b)=>dist[b.i]-dist[a.i]).map(x=>`<div class="row"><span style="width:26px;font-size:18px">${x.e}</span><span style="width:86px;font-size:13px">${x.n}</span><div class="bar grow"><i style="width:${dist[x.i]/tot*100}%"></i></div><span class="muted" style="width:30px;text-align:right">${dist[x.i]}</span></div>`).join('')||'<p class="muted">Még nincs bejegyzés ebben az időszakban.</p>'}</div></section>`}
  else{const src=t==='am'?S.checkins:S.reflections;const ks=Object.keys(src).sort().reverse();
   body=`<button class="btn block" data-a="${t==='am'?'openCheckin':'openReflect'}">${t==='am'?'Mai check-in':'Mai reflexió'}</button>`+(ks.length?ks.slice(0,30).map(k=>{const e=src[k];return`<article class="entry"><div class="row"><b class="grow" style="color:var(--ink);font-size:13px">${fmt(k,{month:'long',day:'numeric',weekday:'long'})}</b>${t==='am'&&e.mood!=null?`<span>${MOODS[e.mood].e}</span>`:''}</div>${t==='am'?`<div><div class="q">Mai cél</div><p>${esc(e.goal)}</p></div><div><div class="q">Hálás vagyok</div><p>${esc(e.grateful)}</p></div>`:`<div><div class="q">Amit teljesítettem</div><p>${esc(e.done)}</p></div><div><div class="q">Amire büszke vagyok</div><p>${esc(e.proud)}</p></div>`}</article>`}).join(''):`<div class="card empty-note">Még nincs bejegyzés.</div>`)}
  return`<div class="top"><button class="iconbtn" data-a="back" aria-label="Vissza">${ic('back')}</button><h1>Hangulatnapló</h1></div>${tabs}${body}`

stats(){
  const N=S.ui.range;const rate=rangeRate(N),cs=curStreak(),ls=longestStreak();
  const days=[...Array(7)].map((_,i)=>{const k=keyOf(addDays(now(),i-6));return{l:WD[wd(parseK(k))],v:dayRate(k)??0,k}});
  const weeks=[...Array(6)].map((_,w)=>{let a=0,b=0;for(let i=0;i<7;i++){const k=keyOf(addDays(now(),-(5-w)*7-i));const r=dayRate(k);if(r!=null){a+=r;b++}}return{l:w===5?'E hét':`${5-w} hete`,v:b?a/b:0}});
  let heat='';const start=addDays(now(),-(7*12-1)-wd(addDays(now(),-(7*12-1))));for(let d=new Date(start);d<=now();d=addDays(d,1)){const r=dayRate(keyOf(d));heat+=`<i class="${r==null||r===0?'':r<.4?'l1':r<.7?'l2':r<1?'l3':'l4'}" title="${fmt(keyOf(d),{month:'short',day:'numeric'})}: ${r==null?'–':Math.round(r*100)+'%'}"></i>`}
  const hi=[],lo=[];Object.keys(S.moods).forEach(k=>{const r=dayRate(k);if(r==null)return;(r>=.8?hi:lo).push(moodScore(S.moods[k].m))});const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const ph={men:[],fol:[],ovu:[],lut:[]};Object.keys(S.moods).forEach(k=>{const c=cycInfo(k);if(c)ph[c.ph].push(moodScore(S.moods[k].m))});
  return`<div class="top"><button class="iconbtn" data-a="back" aria-label="Vissza">${ic('back')}</button><h1 class="grow">Statisztikák</h1></div>
  <div class="seg">${[[7,'7 nap'],[30,'30 nap'],[90,'90 nap']].map(([v,n])=>`<button class="${N===v?'on':''}" data-a="range" data-v="${v}">${n}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><b>${Math.round(rate*100)}%</b><small>teljesítési arány</small></div><div class="kpi"><b>${cs} nap</b><small>aktuális sorozat</small></div><div class="kpi"><b>${ls} nap</b><small>leghosszabb sorozat</small></div><div class="kpi"><b>${totalDone()}</b><small>összes teljesítés</small></div></div>
  ${areaStats(N)}
  ${insightsCard()}
  <section class="card chart"><div class="row"><b class="grow" style="color:var(--ink)">Heti fejlődés</b><span class="muted" id="barInfo">Koppints egy napra</span></div>${bars(days,'d')}</section>
  <section class="card chart"><b style="color:var(--ink)">Havi fejlődés</b><p class="muted">Heti átlagos teljesítés az elmúlt 6 hétben</p>${lineChart(weeks)}</section>
  <section class="card"><b style="color:var(--ink)">Következetesség · 12 hét</b><div class="heat" style="margin-top:12px">${heat}</div><div class="row muted" style="margin-top:10px;font-size:11px;gap:5px">Kevesebb <i style="width:12px;height:12px;border-radius:4px;background:var(--track)"></i><i style="width:12px;height:12px;border-radius:4px;background:color-mix(in srgb,var(--lav) 40%,var(--track))"></i><i style="width:12px;height:12px;border-radius:4px;background:var(--lav)"></i><i style="width:12px;height:12px;border-radius:4px;background:var(--lav-deep)"></i> Több</div></section>
  <section class="card"><b style="color:var(--ink)">Szokások következetessége · ${N} nap</b><div class="cons" style="margin-top:14px">${S.habits.map(h=>{let a=0,b=0;for(let i=0;i<N;i++){const d=addDays(now(),-i);if(!scheduledOn(h,d))continue;b++;if(isDone(h,keyOf(d)))a++}const v=isT(h)?Math.min(1,a/(h.target*N/({weekly:7,monthly:30,yearly:365})[h.freq])):b?a/b:0;return`<div class="row"><span class="tile" style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:${COLORS[h.color]};color:var(--on-pastel)">${ic(h.icon,16)}</span><span class="grow" style="font-size:13.5px">${esc(h.name)}</span><div class="bar" style="width:90px"><i style="width:${v*100}%"></i></div><b style="width:40px;text-align:right;font-size:13px;color:var(--ink)">${Math.round(v*100)}%</b></div>`}).join('')}</div></section>
  <section class="card chart"><b style="color:var(--ink)">Hangulat és szokások</b>${bars([{l:'80% felett',v:av(hi)/5,t:av(hi).toFixed(1).replace('.',',')},{l:'80% alatt',v:av(lo)/5,t:av(lo).toFixed(1).replace('.',',')}],'m')}<div class="insight" style="margin-top:12px">${ic('sparkle')}<p>Azokon a napokon, amikor a szokásaid legalább 80%-át teljesíted, a hangulatod átlagosan <b>${Math.abs(av(hi)-av(lo)).toFixed(1).replace('.',',')} ponttal</b> ${av(hi)>=av(lo)?'jobb':'alacsonyabb'}, mint a többi napon.</p></div></section>
  ${S.cycleOn?`<section class="card chart"><b style="color:var(--ink)">Ciklus és hangulat</b>${bars(Object.keys(ph).map(p=>({l:PHASES[p].n.split(' ')[0],v:av(ph[p])/5,t:av(ph[p]).toFixed(1).replace('.',','),c:PHASES[p].c})),'c')}<p class="muted" style="margin-top:8px">Átlagos hangulat (1–5) ciklusfázisonként</p></section>`:''}`
},

function moodChart(vals){const W=320,H=150,P=24,n=vals.length;const x=i=>P+i*(W-P*2)/(n-1||1),y=v=>H-P-(v-1)/4*(H-P*2);
  const pts=vals.map((v,i)=>v.v?[x(i),y(v.v)]:null).filter(Boolean);let d='';pts.forEach((p,i)=>{if(!i){d=`M${p[0]} ${p[1]}`;return}const q=pts[i-1],cx=(q[0]+p[0])/2;d+=`C${cx} ${q[1]} ${cx} ${p[1]} ${p[0]} ${p[1]}`});
  const area=pts.length?d+`L${pts[pts.length-1][0]} ${H-P}L${pts[0][0]} ${H-P}Z`:'';
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hangulat alakulása"><defs><linearGradient id="ma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBB7F7" stop-opacity=".45"/><stop offset="1" stop-color="#CBB7F7" stop-opacity="0"/></linearGradient></defs>${[1,2,3,4,5].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="2" y="${y(v)+4}" style="font-size:11px">${MOODS[5-v].e}</text>`).join('')}<path d="${area}" fill="url(#ma)"/><path d="${d}" fill="none" stroke="#A88EE6" stroke-width="2.4" stroke-linecap="round"/>${pts.length?`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="#A88EE6" style="stroke:var(--card)" stroke-width="2"/>`:''}${vals.map((v,i)=>n<=7||i%5===0?`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${n<=7?WD[wd(parseK(v.k))]:fmt(v.k,{month:'numeric',day:'numeric'})}</text>`:'').join('')}</svg>`}
function bars(data,id){const W=320,H=150,P=20,bw=Math.min(34,(W-P*2)/data.length*.55);const step=(W-P*2)/data.length;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Oszlopdiagram">${[0,.5,1].map(t=>`<line x1="${P}" x2="${W-P}" y1="${H-P-t*(H-P*2)}" y2="${H-P-t*(H-P*2)}" style="stroke:var(--line)"/>`).join('')}${data.map((d,i)=>{const h=Math.max(4,d.v*(H-P*2)),x=P+i*step+(step-bw)/2;const lab=d.t??Math.round(d.v*100)+'%';return`<g class="barr" data-a="barTip" data-t="${esc(d.l)}: ${lab}"><rect x="${x}" y="${H-P-(H-P*2)}" width="${bw}" height="${H-P*2}" rx="${bw/2.6}" style="fill:var(--track)" opacity=".55"/><rect x="${x}" y="${H-P-h}" width="${bw}" height="${h}" rx="${bw/2.6}" fill="${d.c||(i===data.length-1&&id==='d'?'#B9A2EE':'#D9CBFA')}"/><text x="${x+bw/2}" y="${H-P-h-6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${lab}</text><text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${esc(d.l)}</text></g>`}).join('')}</svg>`}
function lineChart(data){const W=320,H=140,P=22,n=data.length;const x=i=>P+i*(W-P*2)/(n-1),y=v=>H-P-v*(H-P*2);let d='';data.forEach((p,i)=>{d+=(i?'L':'M')+x(i)+' '+y(p.v)});

const recoNames=id=>new Set((RECO[id]||[]).flatMap(g=>g.items.map(r=>r.name)));
/* Ha egy szokást korábban visszatettél az ajánlások közé, újrafelvételkor a régi előzményeivel együtt tér vissza */
/* Szokástár = beépített ötletek + a saját magad létrehozott szokások (S.myLib). Egy saját szokás létrehozásakor
   automatikusan a Szokástárba is bekerül, így törlés után is bármikor újra felvehető. */
function allLib(){const mine=(S.myLib||[]).map(x=>({...x,mine:true}));return[...mine,...LIBRARY.filter(t=>!mine.some(m=>m.name===t.name))]}
function toMyLib(d){const name=(d.name||'').trim();if(!name||LIBRARY.some(t=>t.name===name))return;
  const e={name,icon:d.icon,color:d.color,area:areaOf(d),freq:d.freq,target:d.target,days:d.days,note:(d.note||'').trim()||'Saját szokás',cat:''};
  S.myLib=(S.myLib||[]).filter(x=>x.name!==name);S.myLib.unshift(e)}
function recoHabit(r,area){const old=(S.parked||{})[r.name];if(old){delete S.parked[r.name];return old}return mkHabit({...r,area})}
function recoSection(a,have){if(a.custom)return`<section class="card empty-note" style="text-align:left">Ez a saját életterületed. A fenti <b>+ Új szokás</b> gombbal adhatsz hozzá szokásokat, vagy a Szokástárból is választhatsz.</section>`;
  /* Csak a még fel nem vett javaslatok látszanak; a felvett szokás átkerül a Szokások részbe. Az üres alcsoport eltűnik. */
  const gs=(RECO[a.id]||[]).map((x,i)=>({...x,i,items:x.items.filter(r=>!have.has(r.name))})).filter(x=>x.items.length);
  if(!gs.length)return`<section class="reco reco-done" style="--ac:${a.c}"><div class="reco-head"><span class="reco-mark">${LOTUS('rc')}</span><div class="grow"><div class="eyebrow">Bloomsette ajánlja</div><b>Minden javaslatot felvettél</b><div class="muted">További ötleteket a Szokástárban találsz.</div></div><button class="link" data-a="go" data-s="library">Szokástár</button></div></section>`;
  const want=((S.ui.recoG||{})[a.id])||0,g=gs.find(x=>x.i===want)||gs[0],left=g.items.length;
  return`<section class="reco" style="--ac:${a.c}" aria-label="Bloomsette ajánlja: ${a.n}"><div class="reco-head"><span class="reco-mark">${LOTUS('rc')}</span><div class="grow"><div class="eyebrow">Bloomsette ajánlja</div><b>${g.g}</b></div><button class="link" data-a="go" data-s="library">Szokástár</button></div>
   ${gs.length>1?`<div class="chips">${gs.map(x=>`<button class="chip ${x.i===g.i?'on':''}" data-a="recoG" data-area="${a.id}" data-v="${x.i}">${x.g} · ${x.items.length}</button>`).join('')}</div>`:''}
   <div class="list reco-list">${g.items.map(r=>`<div class="li"><span class="reco-ic" style="background:${COLORS[r.color]}">${ic(r.icon,17)}</span><div class="grow"><b>${r.name}</b><div class="muted">${r.note} · ${freqLabel(r).toLowerCase()}</div></div><button class="chk add" data-a="recoAdd" data-area="${a.id}" data-n="${esc(r.name)}" aria-label="${esc(r.name)} felvétele a szokásaim közé">${ic('plus')}</button></div>`).join('')}</div>
   ${left>1?`<button class="btn ghost block" style="margin-top:10px" data-a="recoAll" data-area="${a.id}" data-g="${g.i}">${ic('plus',16)} Mind a ${left} felvétele</button>`:''}</section>`}

/* ───────── Értesítések ─────────
   Androidon a natív app ütemezi őket (akkor is jönnek, ha az app be van zárva); az exe-ben és a böngészőben
   addig jönnek, amíg a Bloomsette nyitva van. A napok: 0 = hétfő … 6 = vasárnap. */
function notifPlan(){const n=S.notif,out=[],paused=isPaused(TODAY);
  if(n.morning)out.push({id:'morning',...hm(n.mt),title:`Jó reggelt, ${S.name}! 🌸`,text:NOTIFS[4]});
  if(n.evening)out.push({id:'evening',...hm(n.et),title:'Esti reflexió 🌙',text:NOTIFS[5]});
  if(n.streak&&!paused)out.push({id:'streak',...hm(n.st||'20:00'),title:'Ma is számít egy kis lépés 🌱',text:'Egyetlen kipipált szokás is megőrzi a sorozatodat.',skipActive:true});
  if(n.garden)out.push({id:'weekly',h:18,m:0,days:[6],title:'Elkészült a heti visszatekintőd 🌸',text:'Nézd meg, mennyit nőtt a kerted ezen a héten.'});
  if(!paused)S.habits.filter(h=>h.remind).forEach(h=>out.push({id:'h_'+h.id,...hm(h.remind),days:h.freq==='daily'||isT(h)?null:h.days,title:h.name,text:h.note||'Itt az ideje. Egy kis lépés ma is elég 🌸',habit:h.id}));
  return out}
function syncPayload(){const hs=todays();return{today:TODAY,active:active(TODAY),done:S.log[TODAY]||[],alarms:notifPlan(),
  widget:{name:S.name,paused:isPaused(TODAY),items:hs.slice(0,6).map(h=>({id:h.id,name:h.name,color:COLORS[h.color]||'#CBB7F7'}))}}}
let syncT=null;function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(()=>{if(natHas('sync'))natCall('sync',JSON.stringify(syncPayload()))},300)}

/* A widgeten kipipált szokások: az app megnyitásakor érkeznek a natív oldalról */
window.bloomlyPending=json=>{let L=[];try{L=JSON.parse(json)}catch(e){}let ch=0;
  L.forEach(p=>{if(!S.habits.some(h=>h.id===p.id))return;const a=S.log[p.date]||[];const has=a.includes(p.id);if(p.on&&!has){S.log[p.date]=[...a,p.id];ch++}else if(!p.on&&has){S.log[p.date]=a.filter(x=>x!==p.id);ch++}});
  if(ch){save();render(true);toast('A widgeten kipipált szokásaid bekerültek 🌸')}};
function showNotif(t,b){if(window.Notification&&Notification.permission==='granted'){try{new Notification(t,{body:b,icon:'bloomly-256.png',tag:'bloomly'});return}catch(e){}}toast(`${t} · ${b}`)}
function webNotifTick(){if(NAT||!S.onboarded)return;const d=new Date(),wdn=wd(d);let fired={};try{fired=JSON.parse(localStorage.getItem('bloomly.fired')||'{}')}catch(e){}
  let ch=false;notifPlan().forEach(a=>{if(a.h!==d.getHours()||a.m!==d.getMinutes())return;if(a.days&&!a.days.includes(wdn))return;if(a.skipActive&&active(TODAY))return;if(a.habit&&(S.log[TODAY]||[]).includes(a.habit))return;const key=TODAY+'|'+a.id;if(fired[key])return;fired[key]=1;ch=true;showNotif(a.title,a.text)});
  if(ch){Object.keys(fired).forEach(k=>{if(!k.startsWith(TODAY))delete fired[k]});try{localStorage.setItem('bloomly.fired',JSON.stringify(fired))}catch(e){}}}
setInterval(webNotifTick,15000);

function saveB64(name,mime,b64,share){
  if(natHas('saveFile')){const r=natCall('saveFile',name,mime,b64,!!share);toast(r||'Mentve');return}
  const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const blob=new Blob([arr],{type:mime});
  if(share&&navigator.canShare){try{const f=new File([blob],name,{type:mime});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Bloomsette'}).catch(()=>{});return}}catch(e){}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Mentve a Letöltések mappába')}

    <div class="hm-list">${l.map(x=>`<div class="hm-li"><button class="hm-cb ${W[x.id]?'on':''}" data-a="hmW" data-id="${x.id}" aria-pressed="${!!W[x.id]}">${W[x.id]?ic('check',11):''}</button><span class="hm-lt" data-a="hmOpen" data-k="day" data-d="${i}" data-id="${x.id}" role="button" tabindex="0">${esc(x.t)}</span>${del('day',x.id,i)}</div>`).join('')||'<p class="hm-empty">Még üres. Add hozzá, mit szeretnél ezen a napon elvégezni.</p>'}</div>
    ${l.length?`<div class="hm-dbar"><i style="width:${Math.round(dn/l.length*100)}%"></i></div>`:''}${add('day',i)}<span class="hm-wm" aria-hidden="true">${e}</span></section>`}).join('')}
   <section class="hm-day hm-done" style="--dc:#F5C6CF"><div class="hm-dhead"><b>Megcsináltad!</b><span aria-hidden="true">🌞</span></div><div class="hm-house" aria-hidden="true">🏡</div><div class="hm-ring"><b>${st.pct}%</b><small>a heti tervből</small></div><p>Pipálj ki mindent,<br>ragyogjon minden nap.</p></section></div>`}

function hmSheet(k,d,id){const h=ensureHome(),list=k==='daily'?h.daily:k==='time'?h.time:h.days[d],old=id&&list.find(x=>x.id===id);

function hmSheetDraw(){const{k,d,id}=fd;
  openSheet(`<h2>${id?'Feladat szerkesztése':k==='daily'?'Saját napi feladat':`Új feladat · ${HM_DAYS[d][0]}`}</h2>

  <div class="field"><label for="hmt">Megnevezés</label><input class="inp" id="hmt" maxlength="60" value="${esc(fd.t||'')}" placeholder="${k==='daily'?'pl. Virágok locsolása':'pl. Sütő kitakarítása'}"></div>
  ${k==='daily'?`<div class="field"><span class="lbl">Ikon</span>${HM_ICONS.map(([g,l])=>`<div class="hm-ig">${g}</div><div class="hm-emo">${l.map(e=>`<button data-a="hmEmo" data-v="${e}" class="${fd.i===e?'on':''}" aria-label="Ikon ${e.startsWith('svg:')?'porszívó':e}" aria-pressed="${fd.i===e}">${hmIco(e)}</button>`).join('')}</div>`).join('')}</div>`:''}
  <div class="btns hm-sticky">${id?`<button class="btn danger" data-a="hmDelSheet">Törlés</button>`:''}<button class="btn" data-a="hmSave">${id?'Mentés':'Hozzáadás'}</button></div>`);
  if(!id)setTimeout(()=>{const i=$('#hmt');if(i&&!i.value)i.focus()},320)}
const HOME_A={
 hmEdit(){S.ui.hme=!S.ui.hme;render(true)},
 hmD(el){const h=ensureHome(),wk=hmWeek(),L=h.log[wk]=h.log[wk]||{},id=el.dataset.id,d=+el.dataset.d,a=L[id]=L[id]||[];const was=a.includes(d);L[id]=was?a.filter(x=>x!==d):[...a,d];save();render(true);if(!was)hmCheer()},
 hmW(el){const h=ensureHome(),wk=hmWeek(),W=h.wlog[wk]=h.wlog[wk]||{},id=el.dataset.id;if(W[id])delete W[id];else W[id]=true;save();render(true);if(W[id])hmCheer()},
 hmAdd(el){hmSheet(el.dataset.k,el.dataset.d!=null?+el.dataset.d:null)},
 hmOpen(el){hmSheet(el.dataset.k,el.dataset.d!=null?+el.dataset.d:null,el.dataset.id)},
 hmEmo(el){fd.i=el.dataset.v;document.querySelectorAll('#sheet .hm-emo button').forEach(b=>{b.classList.toggle('on',b===el);b.setAttribute('aria-pressed',b===el)});const p=$('#sheet .hm-prev span');if(p)p.innerHTML=hmIco(fd.i)},
 hmSave(){const t=($('#hmt')||{}).value.trim();if(!t){toast('Add meg a megnevezést');return}const h=ensureHome(),list=fd.k==='daily'?h.daily:fd.k==='time'?h.time:h.days[fd.d];
  if(fd.id){const x=list.find(y=>y.id===fd.id);if(x){x.t=t;if(fd.k!=='day')x.i=fd.i}save();closeSheet();render(true);toast('Mentve');return}
  const x={id:'hm'+uid(),t};if(fd.k==='day')list.push(x);else list.push({...x,i:fd.i});save();closeSheet();render(true);toast('Hozzáadva 🌸')},
 hmDelSheet(el){if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Biztosan törlöd?';return}A.hmDel({dataset:{k:fd.k,id:fd.id,d:fd.d!=null?String(fd.d):undefined}});closeSheet()},
 hmDel(el){const h=ensureHome(),id=el.dataset.id,k=el.dataset.k;if(k==='daily')h.daily=h.daily.filter(x=>x.id!==id);else if(k==='time')h.time=h.time.filter(x=>x.id!==id);else h.days[+el.dataset.d]=h.days[+el.dataset.d].filter(x=>x.id!==id);save();render(true)}
};

/* ───────── Frissítés a felhőből ─────────
   Az Android app (BloomlyNative híd) a háttérben letölti az új verziót, majd szól; az exe minden indításkor magától frissít;
   a GitHub Pages címen futó webes változat mindig a legfrissebb. */
const UPD_BASE='https://kovacsanitacintia-del.github.io/bloomly-app/';
const APP_VER=(document.querySelector('meta[name="bloomly-version"]')||{}).content||'';
function verLabel(){const v=(window.BloomlyNative&&BloomlyNative.version&&BloomlyNative.version())||APP_VER;return /^\d{12,14}$/.test(v)?`Verzió: ${v.slice(0,4)}.${v.slice(4,6)}.${v.slice(6,8)}. ${v.slice(8,10)}:${v.slice(10,12)}`:'Fejlesztői változat'}
function updHint(){return window.BloomlyNative?'az app indításkor magától keres':/[?&]app=1/.test(location.search)?'az exe minden indításkor frissül':'a webes változat mindig a legfrissebb'}
window.bloomlyUpdateReady=v=>{$('#upd').innerHTML=`<div class="upd glass" role="status">${ic('sparkle')}<div class="grow"><b>Új Bloomsette-verzió érkezett</b><small>Az adataid megmaradnak.</small></div><button class="btn" data-a="applyUpd">Frissítés</button><button class="iconbtn" data-a="laterUpd" aria-label="Később">${ic('close',16)}</button></div>`};
window.bloomlyUpToDate=()=>toast('A Bloomsette naprakész ✨');
window.bloomlyUpdateFailed=()=>toast('Nem sikerült kapcsolódni. Próbáld újra később.');
Object.assign(A,{
 applyUpd(){$('#upd').innerHTML='';if(window.BloomlyNative)BloomlyNative.applyUpdate();else location.reload()},
 laterUpd(){$('#upd').innerHTML='';toast('A frissítés a következő indításkor is elérhető')},
 checkUpd(){if(window.BloomlyNative){toast('Frissítések keresése…');BloomlyNative.checkNow();return}
  fetch(UPD_BASE+'version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(APP_VER&&j.version>APP_VER){if(location.href.startsWith(UPD_BASE))bloomlyUpdateReady(j.version);else toast('Új verzió érhető el. Indítsd újra az alkalmazást.')}else bloomlyUpToDate()}).catch(()=>bloomlyUpdateFailed())}
});

{const pd=natCall('takePending');if(pd&&pd!=='[]')setTimeout(()=>bloomlyPending(pd),0)}
