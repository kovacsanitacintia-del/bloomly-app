<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="bloomly-version" content="20261101222838">
<link rel="icon" type="image/png" sizes="256x256" href="bloomly-256.png?v=20261101222838">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style><title>Bloomsette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Urbanist:wght@300;400;500;600;700&display=swap">
<style>
/* Elrendezés: telefonkeret asztali nézetben, teljes képernyő mobilon; légies pasztell felületek, üvegkártyák, alsó tabsáv. */
:root{
  --bg:#FFFDFB; --bg2:#F8F5F2; --card:#FFFFFF; --text:#556070; --ink:#465064; --text2:#7D879A;
  --lav:#CBB7F7; --lav-deep:#8F78CF; --lav-soft:#F1EBFD; --rose:#F7E5EA; --peach:#FFD6C2; --mint:#CDECCF; --mint-deep:#5E9C6B;
  --gold:#E9D6A7; --gold-deep:#B48F4E; --line:rgba(85,96,112,.09); --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.8);
  --shadow:0 14px 34px -18px rgba(118,96,170,.35),0 2px 6px -2px rgba(118,96,170,.08);
  --desk:#F3EEF6; --frame:#FFFFFF; --sky1:#F4ECFE; --sky2:#FFF1EA; --hill1:#E3F1E1; --hill2:#CDECCF; --pond:#D8E8F6; --trunk:#B9A08C;
  --sun:#F3E3BC; --on-pastel:#4A4360; --track:#EFEAF4;
  --f-display:"Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --btn1:#C7B2F6; --btn2:#B39CEC; --btn-shadow:rgba(140,110,210,.9);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1925; --bg2:#231F2E; --card:#2A2537; --text:#E3DEEC; --ink:#F1ECF7; --text2:#A69FB8;
  --lav:#B9A3EE; --lav-deep:#CDBBF7; --lav-soft:#332B47; --rose:#3B2E3A; --peach:#E9BBA6; --mint:#A5D3AA; --mint-deep:#A5D3AA;
  --gold:#E0C98F; --gold-deep:#E0C98F; --line:rgba(255,255,255,.07); --glass:rgba(42,37,55,.66); --glass-line:rgba(255,255,255,.08);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.3);
  --desk:#14121B; --frame:#2A2537; --sky1:#2A2440; --sky2:#3A2E45; --hill1:#2E3B35; --hill2:#3B5245; --pond:#33405A; --trunk:#7E6A5E;
  --sun:#EDE3C6; --on-pastel:#2B2538; --track:#352F44; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1925; --bg2:#231F2E; --card:#2A2537; --text:#E3DEEC; --ink:#F1ECF7; --text2:#A69FB8;
  --lav:#B9A3EE; --lav-deep:#CDBBF7; --lav-soft:#332B47; --rose:#3B2E3A; --peach:#E9BBA6; --mint:#A5D3AA; --mint-deep:#A5D3AA;
  --gold:#E0C98F; --gold-deep:#E0C98F; --line:rgba(255,255,255,.07); --glass:rgba(42,37,55,.66); --glass-line:rgba(255,255,255,.08);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.3);
  --desk:#14121B; --frame:#2A2537; --sky1:#2A2440; --sky2:#3A2E45; --hill1:#2E3B35; --hill2:#3B5245; --pond:#33405A; --trunk:#7E6A5E;
  --sun:#EDE3C6; --on-pastel:#2B2538; --track:#352F44; color-scheme:dark }

/* További témák: a data-palette a világos vagy sötét alapra teszi rá a saját színeit */
:root[data-palette="rozsa"]{--bg:#FFFBFC;--bg2:#FBF1F4;--lav:#F2B8C9;--lav-deep:#C2607F;--lav-soft:#FCEAF0;--sky1:#FDEBF1;--sky2:#FFF3EC;--desk:#F8EDF1;--track:#F5E6EC;--btn1:#F3BCD0;--btn2:#DE8FAE;--btn-shadow:rgba(214,120,155,.75)}
:root[data-palette="menta"]{--bg:#FBFEFB;--bg2:#F1F8F2;--lav:#A9D9B4;--lav-deep:#3F8A57;--lav-soft:#E6F5E9;--sky1:#E9F7EE;--sky2:#FBF8EC;--desk:#EDF5EF;--track:#E3EFE5;--btn1:#9FD8B0;--btn2:#6DBA88;--btn-shadow:rgba(90,170,120,.7)}
:root[data-palette="barack"]{--bg:#FFFCFA;--bg2:#FBF3EE;--lav:#FFC4A8;--lav-deep:#B8623D;--lav-soft:#FFEDE4;--sky1:#FFEFE5;--sky2:#FFF7E8;--desk:#F9EFE9;--track:#F6E7DE;--btn1:#FFC2A5;--btn2:#EE9A76;--btn-shadow:rgba(230,140,100,.7)}
:root[data-palette="arany"]{--bg:#FFFDF8;--bg2:#F8F3E9;--lav:#E3CB93;--lav-deep:#8C6A2E;--lav-soft:#F8F0DE;--sky1:#FBF3E1;--sky2:#FFF4EA;--desk:#F5EFE3;--track:#F0E8D8;--btn1:#E2C88C;--btn2:#C29A55;--btn-shadow:rgba(190,150,80,.7)}
:root[data-palette="tenger"]{--bg:#FBFDFF;--bg2:#F0F5FA;--lav:#AFCDEE;--lav-deep:#3F72A8;--lav-soft:#E6F0FB;--sky1:#E6F1FC;--sky2:#F3F9F6;--desk:#ECF2F8;--track:#E3ECF5;--btn1:#ABCBEF;--btn2:#7AA4D8;--btn-shadow:rgba(100,150,210,.7)}
:root[data-palette="ejfel"]{--bg:#1D161C;--bg2:#271D25;--card:#2F232C;--lav:#E3A6BC;--lav-deep:#F2C3D3;--lav-soft:#43293A;--glass:rgba(47,35,44,.66);--sky1:#3B2333;--sky2:#2C2038;--desk:#150F14;--frame:#2F232C;--track:#40303B;--btn1:#E6A9BF;--btn2:#C47A98;--btn-shadow:rgba(0,0,0,.6)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:56px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lav-deep);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.aside{display:none;max-width:320px}
.aside .wm{font-family:var(--f-display);letter-spacing:.34em;font-weight:500;font-size:15px;color:var(--ink)}
.aside h2{font-size:34px;font-weight:400;margin-block:18px 12px;line-height:1.15}
.aside p{color:var(--text2)}
.aside a{color:var(--lav-deep);font-weight:600;text-decoration:none}
@media (min-width:1000px) and (hover:hover) and (pointer:fine){:root:not(.native) .aside{display:block}}

/* A .phone a méretezés alapja: telefonon és tableten kitölti a képernyőt, és a belső elrendezés a saját szélességéhez igazodik (container query).
   Telefonkeret csak asztali böngészőben jelenik meg, az Android appban és az exe-ben soha. */
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;isolation:isolate;container-type:inline-size;container-name:app}
@media (min-width:640px) and (hover:hover) and (pointer:fine){:root:not(.native) .phone{width:402px;height:min(870px,calc(100% - 40px));border-radius:48px;border:9px solid var(--frame);box-shadow:0 40px 80px -40px rgba(90,70,140,.45),0 0 0 1px var(--line)}}
.phone::before{content:"";position:absolute;inset:-20% -30% auto;height:420px;background:radial-gradient(closest-side,color-mix(in srgb,var(--lav) 40%,transparent),transparent),radial-gradient(closest-side at 80% 40%,color-mix(in srgb,var(--peach) 45%,transparent),transparent);opacity:.55;z-index:-1;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 0;display:flex;flex-direction:column;gap:18px}
.screen-in{animation:screenIn .5s var(--ease)}
@keyframes screenIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);font-weight:600}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello h1{font-size:30px;font-weight:500;line-height:1.1;margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--lav),var(--peach));display:grid;place-items:center;color:var(--on-pastel);font-family:var(--f-display);font-weight:600;font-size:17px;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-h h2{font-size:20px;font-weight:600}
.link{color:var(--lav-deep);font-weight:600;font-size:13px}

.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-line);border-radius:28px;box-shadow:var(--shadow)}
.muted{color:var(--text2);font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* Főoldali hero */
.hero{padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink);line-height:1;display:block}
.ring .val span{font-size:11.5px;color:var(--text2)}
.ring circle{transition:stroke-dashoffset 1.1s var(--ease)}
.stat-chips{display:flex;flex-direction:column;gap:10px}
.chip-stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--bg2)}
.chip-stat .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--on-pastel)}
.chip-stat b{font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:600;display:block;line-height:1.15}
.chip-stat small{font-size:11.5px;color:var(--text2)}

/* Check-in */
.checkin{padding:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--lav) 55%,var(--card)),color-mix(in srgb,var(--peach) 50%,var(--card)));border-radius:28px;box-shadow:var(--shadow);color:var(--on-pastel);position:relative;overflow:hidden}
.checkin h3{font-size:22px;color:var(--on-pastel);font-weight:600}
.checkin p{opacity:.8;font-size:13.5px;margin-top:4px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:16px}
.mood-b{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:16px;background:rgba(255,255,255,.55);font-size:10.5px;line-height:1.15;text-align:center;color:var(--on-pastel);transition:transform .3s var(--ease),background .3s}
.mood-b .e{font-size:22px;line-height:1}
.mood-b:hover{transform:translateY(-3px)}
.mood-b.on{background:#fff;box-shadow:0 8px 20px -10px rgba(80,60,120,.5);transform:translateY(-3px)}
.moods.plain .mood-b{background:var(--bg2);color:var(--text)}
.moods.plain .mood-b.on{background:var(--lav-soft);outline:1.5px solid var(--lav)}

/* Szokás sorok */
.habits{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px;background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(118,96,170,.4);transition:transform .35s var(--ease),opacity .35s}
.habit .tile{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.habit .name{font-weight:600;color:var(--ink);font-size:15px;line-height:1.25}
.habit .meta{font-size:12.5px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.habit.done .name{color:var(--text2)}
.chk{position:relative;width:38px;height:38px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--lav) 80%,var(--text2));display:grid;place-items:center;flex:none;color:transparent;transition:all .4s var(--ease)}
.chk svg{width:18px;height:18px;stroke-width:2.4}
.habit.done .chk{background:var(--mint);border-color:var(--mint);color:#3F6B48}
.chk .petal{position:absolute;left:50%;top:50%;width:9px;height:14px;margin:-7px 0 0 -4.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--lav);opacity:0;pointer-events:none}
.chk.burst .petal{animation:petal .9s var(--ease) forwards}
@keyframes petal{0%{opacity:.95;transform:rotate(var(--r)) translateY(0) scale(.4)}100%{opacity:0;transform:rotate(var(--r)) translateY(-30px) scale(1)}}
.chk.burst{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}

.quote{padding:22px;position:relative;overflow:hidden}
.quote .q{font-family:var(--f-display);font-size:21px;line-height:1.35;color:var(--ink);font-weight:400;margin-top:10px}
.quote .mark{position:absolute;right:-18px;bottom:-24px;width:120px;opacity:.14;color:var(--lav-deep)}
.quote .acts{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

.garden-prev{padding:0;overflow:hidden}
.garden-prev .meta{padding:14px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--lav),var(--peach));transition:width 1s var(--ease)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--peach))}

.fab{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:100px;width:58px;height:58px;border-radius:22px;background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -12px var(--btn-shadow);z-index:5;transition:transform .3s var(--ease)}
.fab:hover{transform:translateY(-2px) rotate(90deg)}
.fab svg{width:26px;height:26px;stroke-width:2}
.fab[hidden]{display:none}

.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:70px;display:flex;justify-content:space-around;align-items:center;z-index:6;padding-inline:max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text2);padding:8px 10px;border-radius:18px;transition:color .3s}
.tab.on{color:var(--lav-deep)}
.tab.on svg{stroke-width:1.9}
.tab .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
.tab.on .dot{opacity:1}

/* Fejléc aloldalakon */
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:26px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:15px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 6px 16px -12px rgba(118,96,170,.5);color:var(--ink);flex:none}

.seg{display:flex;background:var(--bg2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text2);transition:all .3s var(--ease)}
.seg.wide button{flex:auto;padding-inline:10px;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 12px -8px rgba(80,60,120,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600;color:var(--text);border:1px solid transparent;transition:all .3s}
.chip.on{background:var(--lav-soft);color:var(--lav-deep);border-color:color-mix(in srgb,var(--lav) 70%,transparent)}
.wrapchips{flex-wrap:wrap;overflow:visible}

.week{display:flex;gap:5px;margin-top:8px}
.week i{width:16px;height:6px;border-radius:4px;background:var(--track)}
.week i.y{background:var(--hc,var(--lav))}

/* Lapok (sheet) */
.scrim{position:absolute;inset:0;background:rgba(40,30,60,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;opacity:0;transition:opacity .35s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:32px 32px 0 0;z-index:21;transform:translateY(105%);transition:transform .5s var(--ease);padding:10px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));scrollbar-width:none}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--track);margin:4px auto 16px}
.sheet h2{font-size:23px;font-weight:600;margin-bottom:4px;padding-right:48px}
.sheet-x{position:absolute;top:16px;right:max(18px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:13px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);outline:none;transition:border .3s,box-shadow .3s;color:var(--ink)}
.inp:focus{border-color:var(--lav);box-shadow:0 0 0 4px color-mix(in srgb,var(--lav) 25%,transparent)}
textarea.inp{min-height:92px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:18px;font-weight:700;font-size:15px;background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 14px 26px -14px var(--btn-shadow);transition:transform .25s var(--ease),filter .25s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn.block{width:100%}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--rose);color:#A0526A;box-shadow:none}
.btns{display:flex;gap:10px;margin-top:22px}
.btns .btn{flex:1}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icongrid button{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--bg2);display:grid;place-items:center;color:var(--ink);border:1.5px solid transparent}
.icongrid button.on{border-color:var(--lav);background:var(--lav-soft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:2px;padding-right:6px}
.cchip>button:first-child{font:inherit;color:inherit;font-weight:inherit}
.cchip .cx{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.cchip .cx:hover{background:color-mix(in srgb,var(--text2) 15%,transparent)}
.add-cat{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1.5px dashed color-mix(in srgb,var(--lav) 75%,transparent);color:var(--lav-deep)}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--lav-deep)}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:12px;background:var(--bg2);font-size:12.5px;font-weight:700}
.days button.on{background:var(--lav);color:var(--on-pastel)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:14px;background:var(--bg2);font-size:20px;color:var(--ink)}
.stepper b{font-family:var(--f-display);font-size:22px;color:var(--ink);min-width:24px;text-align:center}

/* Hőtérkép */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;overflow-x:auto}
.heat i{width:16px;height:16px;border-radius:5px;background:var(--track)}
.heat i.l1{background:color-mix(in srgb,var(--lav) 40%,var(--track))}
.heat i.l2{background:color-mix(in srgb,var(--lav) 70%,var(--track))}
.heat i.l3{background:var(--lav)}
.heat i.l4{background:var(--lav-deep)}

/* Kert */
.garden svg{display:block;width:100%;height:auto}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.bloom-new .head{transform-box:fill-box;transform-origin:50% 50%;animation:bloomIn 1.6s var(--ease) both}
@keyframes bloomIn{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.fly{animation:fly 9s ease-in-out infinite}
.swim{animation:swim 11s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,2px)}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30px,-14px)}50%{transform:translate(60px,4px)}75%{transform:translate(26px,12px)}100%{transform:translate(0,0)}}
.wing{transform-box:fill-box;transform-origin:50% 50%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.ripple{animation:ripple 4s ease-in-out infinite}
@keyframes ripple{50%{opacity:.4}}
.glow{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.item .art{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.item b{font-size:12.5px;color:var(--ink);line-height:1.2}
.item small{font-size:10.5px;color:var(--text2);line-height:1.25}
.item.locked .art{filter:grayscale(1);opacity:.45}
.rar{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px}
.rar.k{background:var(--mint);color:#3F6B48}.rar.r{background:var(--lav-soft);color:var(--lav-deep)}.rar.s{background:var(--peach);color:#8A4E33}.rar.l{background:var(--gold);color:#6E5426}

/* Ciklus */
.cyc{display:grid;place-items:center;position:relative}
.cyc svg{width:250px;height:250px;max-width:100%}
.cyc .mid{position:absolute;text-align:center}
.cyc .mid b{font-family:var(--f-display);font-size:44px;font-weight:500;color:var(--ink);line-height:1;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:12px;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11px;color:var(--text2);font-weight:700}
.cal span{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:12px;font-size:13px;font-variant-numeric:tabular-nums}
.cal .p{background:#F7CBD6;color:#7A3C50}.cal .pp{border:1.5px dashed #E9A8B8}.cal .f{background:var(--mint);color:#3F6B48}.cal .o{background:var(--peach);color:#8A4E33}.cal .t{box-shadow:0 0 0 2px var(--lav-deep)}
.cal .x{opacity:.0}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--on-pastel)}
.energy{display:flex;gap:8px}
.energy button{flex:1;height:44px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;color:var(--text2);font-weight:700}
.energy button.on{background:var(--gold);color:#6E5426}

/* Statisztika */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--ink);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--text2)}
.chart svg:not(.i){width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text2);font-size:10px;font-family:var(--f-body)}
.chart .barr{transition:opacity .2s;cursor:pointer}
.chart .barr:hover{opacity:.8}
.cons{display:flex;flex-direction:column;gap:12px}
.insight>svg.i{flex:none;width:22px;height:22px;margin-top:1px;color:var(--lav-deep)}
.insight>p{min-width:0;flex:1}
.insight{display:flex;gap:12px;padding:14px;border-radius:20px;background:var(--lav-soft);color:var(--ink);font-size:13.5px}

/* Vision board */
.vhero{position:relative;overflow:hidden;padding:22px 20px 18px;text-align:center;background:linear-gradient(155deg,color-mix(in srgb,var(--lav) 30%,var(--card)),color-mix(in srgb,var(--peach) 26%,var(--card)));cursor:pointer;width:100%;display:block}
.vhero::before{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--rose) 70%,transparent),transparent 70%);pointer-events:none}
.vword{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1.1;margin:6px 0 4px;color:var(--ink);letter-spacing:.01em}
.vword.ph{font-size:22px;color:var(--text2)}
.vhero .muted{max-width:300px;margin:0 auto}
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.vstats div{padding:10px 4px;border-radius:16px;background:color-mix(in srgb,var(--card) 70%,transparent);display:flex;flex-direction:column;gap:2px}
.vstats b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.vstats small{font-size:11px;color:var(--text2)}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-flow:dense;grid-auto-rows:minmax(150px,auto)}
.vc{position:relative;border-radius:24px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);color:var(--on-pastel);overflow:hidden;isolation:isolate;touch-action:pan-y;transition:transform .3s var(--ease),box-shadow .3s;cursor:pointer;text-align:left}
.vc:hover{transform:translateY(-2px)}
.vc.dragging{opacity:.85;transform:scale(1.04);z-index:3;box-shadow:0 30px 50px -20px rgba(80,60,120,.6)}
.vc.tall{grid-row:span 2}
.vc.wide{grid-column:span 2}
.vc .t{font-family:var(--f-display);font-size:18px;line-height:1.3;font-weight:500;margin-top:auto;overflow-wrap:anywhere}
.vc .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.72;display:flex;align-items:center;gap:5px}
.vc .tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
.vc .tools button{width:24px;height:28px;border-radius:9px;display:grid;place-items:center;background:transparent;color:var(--on-pastel);flex:none}
.vtag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px 5px 8px;border-radius:999px;background:rgba(255,255,255,.55);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vtag svg.i{width:12px;height:12px;flex:none}
.vc .grip{cursor:grab;touch-action:none}
.vc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.vc.img{color:#fff}
.vc.img .vtag{background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vc.img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(30,20,40,.6));z-index:-1}
.vc.night{color:#F5EFFF}
.vc.night .vtag{background:rgba(255,255,255,.14);color:#F5EFFF}
.vc.img .tools button,.vc.night .tools button{color:inherit}
.vq{font-family:var(--f-display);font-size:54px;line-height:.6;height:22px;opacity:.35;margin-top:6px}
.vc.quote .t{font-style:italic}
.vc.affirm{align-items:center;text-align:center}
.vc.affirm .tools{align-self:stretch}
.vc.affirm .t{margin:auto 0;font-size:19px}
.vc.goal .t,.vc.dream .t{font-family:inherit;font-size:15.5px;font-weight:700;line-height:1.35}
.vprog{display:flex;flex-direction:column;gap:5px}
.vprog .bar{height:6px;background:rgba(255,255,255,.6)}
.vprog .bar i{background:color-mix(in srgb,var(--on-pastel) 55%,transparent)}
.vprog small,.vdue{font-size:11px;font-weight:600;opacity:.8;display:flex;align-items:center;gap:5px}
.vdue.late{color:#B4546C;opacity:1}
.vc.done::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 10px,transparent 10px 20px);z-index:-1}
.vbadge{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:4px 10px;border-radius:999px;background:#6FAE7B;color:#fff;font-size:11px;font-weight:700}
.vc.empty{border:2px dashed color-mix(in srgb,var(--lav) 70%,transparent);background:var(--card);box-shadow:none;color:var(--text2);align-items:center;justify-content:center;text-align:center;gap:8px}
.vtypes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vtypes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--bg2);border:1.5px solid transparent;font-size:12px;font-weight:700;color:var(--ink)}
.vtypes button.on{border-color:var(--lav);background:var(--lav-soft);color:var(--lav-deep)}
.vbgs button{width:42px;height:42px;border-radius:14px}
.cdot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.vrow .tile{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.vrow .grow{min-width:0;display:flex;flex-direction:column;gap:5px}
.vrow b{font-size:14px;color:var(--ink);line-height:1.3}
.vrow small{font-size:11.5px;color:var(--text2)}
.vrow .pct{font-weight:700;color:var(--lav-deep);font-variant-numeric:tabular-nums;font-size:14px}
.vrow.done b{text-decoration:line-through;color:var(--text2)}
.vsec{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:700;margin-top:6px}
.videa{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.videa p{flex:1;font-size:13.5px;color:var(--ink);line-height:1.35}
.videa small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);font-weight:700;margin-bottom:3px}
.videa button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--lav-soft);color:var(--lav-deep);flex:none}
.vd-img{width:100%;max-height:240px;object-fit:cover;border-radius:20px;margin-top:12px}
.vd-note{margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--bg2);font-size:13.5px;color:var(--ink)}
.vd-prog{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.vd-prog .row{justify-content:space-between}
.vd-prog b{font-size:22px;color:var(--ink)}
.vsteps{display:flex;flex-direction:column;gap:6px}
.vstep{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bg2);text-align:left;font-size:14px;color:var(--ink);width:100%}
.vstep.on{color:var(--text2);text-decoration:line-through}
.vbox{width:22px;height:22px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--text2) 40%,transparent);display:grid;place-items:center;flex:none;color:#fff}
.vstep.on .vbox{background:#6FAE7B;border-color:#6FAE7B}
.vd-habit{margin-top:14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--lav-soft);font-size:13px;color:var(--ink)}
.btn.danger{background:#F3D3D9;color:#9A3B52}
.modal.vplay{padding:0;background:rgba(25,18,40,.88);display:flex;flex-direction:column;justify-content:center;align-items:stretch}
.vp-bars{position:absolute;top:max(22px,env(safe-area-inset-top,0px));left:18px;right:66px;display:flex;gap:4px}
.vp-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.vp-bars i.on{background:rgba(255,255,255,.85)}
.vp-bars i.cur::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:vpfill 7s linear forwards}
@keyframes vpfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.vp-x{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.14)!important;color:#fff!important}
.vp-card{margin:0 22px;border-radius:32px;min-height:56%;padding:30px 26px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;color:var(--on-pastel);position:relative;overflow:hidden;isolation:isolate;animation:rise .7s var(--ease);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.vp-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.vp-card.img,.vp-card.night{color:#fff}
.vp-card.img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(20,14,30,.7));z-index:-1}
.vp-card.img{justify-content:flex-end}
.vp-card .t{font-family:var(--f-display);font-size:28px;line-height:1.25;font-weight:500;overflow-wrap:anywhere}
.vp-nav{display:flex;justify-content:space-between;align-items:center;margin:20px 22px 0;color:#fff}
.vp-nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;flex:none}
.vp-nav p{font-size:13px;opacity:.75;text-align:center;flex:1;padding:0 10px}

/* Jelvények */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 6px;border-radius:22px;background:var(--card);border:1px solid var(--line);min-width:0}
.badge svg{width:64px;height:64px}
.badge b{font-size:12.5px;color:var(--ink);line-height:1.2}
.badge small{font-size:10.5px;color:var(--text2)}
.badge.locked svg{filter:grayscale(1);opacity:.35}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:transform .3s var(--ease)}
.brow:hover{transform:translateY(-1px)}
.brow .bmed{width:52px;height:52px;flex:none;border-radius:50%;display:block}
.brow .bmed svg{width:52px;height:52px;display:block}
.brow.locked .bmed svg{filter:grayscale(1);opacity:.4}
.brow .grow{min-width:0;display:flex;flex-direction:column;gap:2px}
.brow b{font-size:14px;color:var(--ink);line-height:1.25}
.brow small{font-size:12px;color:var(--text2);line-height:1.3}
.brow .bst{flex:none;font-size:12px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.brow.got .bst{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#DDF2DE;color:#4F8A5B}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}

/* Lista elemek a profilban */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mi{padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px -14px rgba(118,96,170,.4);transition:transform .3s var(--ease)}
.mi:hover{transform:translateY(-2px)}
.mi .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:var(--on-pastel)}
.mi b{color:var(--ink);font-size:15px;display:block}
.mi small{color:var(--text2);font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:30px;background:var(--track);position:relative;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .35s var(--ease)}
.switch.on{background:var(--lav)}
.switch.on::after{transform:translateX(20px)}
.notif{display:flex;gap:12px;padding:14px;border-radius:22px;align-items:flex-start}
.notif .ap{width:38px;height:38px;border-radius:11px;flex:none}
.entry{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.entry .q{font-size:12px;color:var(--text2);font-weight:600}
.entry p{color:var(--ink);font-size:14.5px}

/* Onboarding */
.ob{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:26px max(24px,env(safe-area-inset-right,0px)) 26px max(24px,env(safe-area-inset-left,0px));overflow-y:auto}
.ob::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 20% 10%,color-mix(in srgb,var(--lav) 45%,transparent),transparent),radial-gradient(50% 35% at 90% 30%,color-mix(in srgb,var(--peach) 45%,transparent),transparent),radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,var(--mint) 45%,transparent),transparent);z-index:-1;pointer-events:none}
.ob .prog{display:flex;gap:6px}
.ob .prog i{flex:1;height:4px;border-radius:4px;background:var(--track);transition:background .5s}
.ob .prog i.on{background:var(--lav)}
.ob{overflow-x:hidden}
.ob .body{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:14px;padding-block:22px}
.ob .body.fwd{animation:obFwd .55s var(--ease)}
.ob .body.bk{animation:obBk .55s var(--ease)}
@keyframes obFwd{from{opacity:0;transform:translateX(34px)}}
@keyframes obBk{from{opacity:0;transform:translateX(-34px)}}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-bar{flex:1;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.ob-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lav),var(--peach));transition:width .7s var(--ease)}
.ob-count{font-size:12px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.ob-link{margin-top:14px;align-self:center}
.ob-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.ob-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.ob-pills span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:12.5px;font-weight:600;color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:screenIn .7s var(--ease) backwards}
.ob-pills span:nth-child(2){animation-delay:.12s}.ob-pills span:nth-child(3){animation-delay:.24s}
.ob-pills svg.i{color:var(--lav-deep)}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{position:relative;padding:18px 12px 16px;border-radius:22px;background:var(--glass);border:1.5px solid var(--glass-line);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s var(--ease),border-color .3s,background .3s}
.area .tile{width:46px;height:46px;border-radius:16px;margin-bottom:2px;display:grid;place-items:center;color:var(--on-pastel);background:var(--ac)}
.area b{color:var(--ink);font-size:14.5px}
.area small{font-size:11.5px;color:var(--text2);line-height:1.35}
.area:hover{transform:translateY(-2px)}
.area-grid.three{grid-template-columns:repeat(3,1fr);gap:8px}
.area.sm{padding:14px 6px 12px;gap:6px;border-radius:18px}
.area.sm .tile{width:38px;height:38px;border-radius:13px;margin-bottom:0}
.area.sm b{font-size:12.5px;line-height:1.25}
.area.sm .tick{top:6px;right:6px;width:18px;height:18px}
.area.on{border-color:color-mix(in srgb,var(--ac) 70%,var(--lav-deep));background:color-mix(in srgb,var(--ac) 32%,var(--card));transform:translateY(-2px)}
.area .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--lav-deep);color:var(--card);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease)}
.area.on .tick{transform:scale(1)}
.gnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--card);background:transparent;border:1.5px dashed color-mix(in srgb,var(--text2) 50%,transparent);flex:none;transition:all .3s var(--ease)}
.goal.on .gnum{background:var(--lav-deep);border:0}
.ob-chk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid color-mix(in srgb,var(--lav) 80%,var(--text2));color:#3F6B48;transition:all .3s var(--ease)}
.opt.on .ob-chk{background:var(--mint);border-color:var(--mint)}
.ob-count-pill{align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--lav-soft);color:var(--lav-deep);font-size:12.5px;font-weight:700}
.ob-count-pill.warn{background:var(--peach);color:#8A4E33}
.lf-wrap{display:grid;place-items:center}
.lf{width:100%;max-width:290px;display:block;margin:0 auto;overflow:visible}
.lf.sm{width:58px;height:58px;max-width:58px;margin:0}
.lf-p{transform-box:view-box;transform-origin:0 0;transition:transform .6s var(--ease);cursor:pointer}
.lf-p.grow{animation:lfGrow 1.1s var(--ease) backwards}
@keyframes lfGrow{from{transform:scale(0)}}
.lf-g.sel .lf-p{stroke:var(--lav-deep);stroke-width:2.5;vector-effect:non-scaling-stroke}
.lf-ic{cursor:pointer}
.lf-ic circle{transition:r .3s}
.lf-ic.sel circle{stroke:var(--lav-deep);stroke-width:2.5}
.lf-avg{font-family:var(--f-display);font-size:15px;font-weight:700;fill:#5A4A2A}
.lf-panel{display:flex;flex-direction:column;gap:12px}
.lf-val{font-family:var(--f-display);font-size:30px;color:var(--ink);font-weight:600;line-height:1}
.lf-val small{font-size:14px;color:var(--text2);font-weight:500}
#lfr{width:100%;accent-color:var(--lav-deep);height:28px;cursor:pointer}
.lf-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:-6px}
.lf-dots{display:flex;justify-content:space-between;gap:4px}
.lf-dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--on-pastel);border:2px solid transparent;transition:transform .3s var(--ease)}
.lf-dot.on{border-color:var(--lav-deep);transform:translateY(-2px)}
.ob-garden{border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.ob-garden svg{display:block;width:100%;height:auto}
.bloom-new .head{animation-delay:var(--d,0s)}
.ob-tip{animation:screenIn .6s var(--ease) backwards}
.ob-phases{display:flex;gap:6px}
.ob-phases span{flex:1;text-align:center;padding:8px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--on-pastel)}
.mood-big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.mood-big button{padding:14px 2px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glass-line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;line-height:1.15;text-align:center;font-weight:600;color:var(--ink);min-width:0;transition:transform .35s var(--ease),background .3s,border-color .3s}
.mood-big .e{font-size:27px;line-height:1;transition:transform .35s var(--ease)}
.mood-big button:hover .e{transform:scale(1.12)}
.mood-big button.on{transform:translateY(-4px);border-color:var(--lav);background:var(--lav-soft)}
.mood-big button.on .e{transform:scale(1.15)}
.mood-reply{animation:screenIn .5s var(--ease)}
.notif-demo{animation:notifIn .9s var(--ease) .25s backwards}
@keyframes notifIn{from{opacity:0;transform:translateY(-18px) scale(.96)}}
.theme-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{border-radius:18px;padding:8px 8px 10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink);min-width:0;transition:transform .3s var(--ease),border-color .3s}
.tcard.on{border-color:var(--lav-deep);transform:translateY(-2px)}
.tprev{height:84px;border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tprev i{height:10px;border-radius:5px;display:block}
.flower-pick{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc((100% - 24px) / 4.4);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.flower-pick .fp{scroll-snap-align:start;min-width:0}
.fp-hint{font-size:12px;text-align:center;margin-top:-6px}
.fp{border-radius:18px;background:var(--glass);border:1.5px solid var(--glass-line);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink);min-width:0;transition:transform .3s var(--ease),border-color .3s}
.fp.on{border-color:var(--lav-deep);background:var(--lav-soft);transform:translateY(-2px)}
.seed{animation:float 2.4s ease-in-out infinite}
.plant-btn{position:relative;overflow:hidden;width:100%;padding:17px;border-radius:20px;background:var(--lav-soft);color:var(--lav-deep);font-weight:700;border:1.5px solid var(--lav);user-select:none;-webkit-user-select:none;touch-action:none}
.plant-btn i{position:absolute;inset:0 auto 0 0;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,#C7B2F6,#A88EE6)}
.plant-btn span{position:relative;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.plant-btn.full span{color:#fff}
.ob-final-flower{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent),transparent 70%);animation:float 6s ease-in-out infinite}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-lf{display:flex;align-items:center;gap:10px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:saturate(.6)}
.ob h1{font-size:32px;font-weight:500;line-height:1.12}
.ob .lead{color:var(--text2);font-size:15.5px}
.ob .foot{display:flex;gap:10px;align-items:center}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glass-line);text-align:left;width:100%;transition:all .3s var(--ease);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opt.on{border-color:var(--lav);background:color-mix(in srgb,var(--lav-soft) 85%,transparent)}
.opt .tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.opt b{color:var(--ink);font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.logo-big{width:124px;height:124px;border-radius:34px;box-shadow:0 28px 54px -24px rgba(176,120,150,.75),0 2px 8px -2px rgba(176,120,150,.25);animation:float 6s ease-in-out infinite}
.logo-big svg{display:block;width:100%;height:100%}
.brand-wm{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:clamp(30px,10.5vw,42px);font-weight:500;letter-spacing:.13em;line-height:1;margin-right:-.13em;white-space:nowrap;color:color-mix(in srgb,#74505F 72%,var(--ink))}
.brand-tag{display:flex;align-items:center;gap:10px;margin-top:-4px;font-size:10.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#B08D57}
.brand-tag i{width:30px;height:1px;background:currentColor;opacity:.7}
@keyframes float{50%{transform:translateY(-8px)}}
.wordmark{font-family:var(--f-display);letter-spacing:.38em;font-weight:500;color:var(--ink);font-size:15px}

/* Effektek */
.fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fall{position:absolute;top:-20px;width:12px;height:16px;border-radius:60% 0 60% 0;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px var(--gold);animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{transform:scale(0);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.modal{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:24px;background:rgba(40,30,60,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--bg);border-radius:32px;padding:30px 24px 24px;text-align:center;width:100%;max-width:330px;animation:rise .7s var(--ease);box-shadow:var(--shadow)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
.modal .medal{width:130px;height:130px;margin:0 auto 10px;border-radius:50%}
.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-140%);z-index:45;padding:12px 18px;border-radius:18px;font-size:13.5px;font-weight:600;color:var(--ink);transition:transform .5s var(--ease);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.steps-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps-dots i{width:7px;height:7px;border-radius:50%;background:var(--track)}
.steps-dots i.on{background:var(--lav-deep);width:20px;border-radius:7px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty-note{padding:22px;text-align:center;color:var(--text2);font-size:13.5px}

/* Bloomsette 2.0 */
.chk.on,.ch-today.on .chk{background:var(--mint);border-color:var(--mint);color:#3F6B48}
.pause-card,.review-card,.kind-card,.ch-home{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.pause-card .ic,.review-card .ic,.kind-card .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--on-pastel)}
.pause-card{background:color-mix(in srgb,var(--sky) 45%,var(--card))}
.pause-card .ic{background:var(--sky)}
.pause-card b,.review-card b,.ch-home b{color:var(--ink)}
.review-card{background:linear-gradient(135deg,color-mix(in srgb,var(--lav) 35%,var(--card)),color-mix(in srgb,var(--peach) 30%,var(--card)))}
.review-card .ic{background:var(--lav)}
.kind-card .ic{background:var(--gold)}
.kind-card p{font-size:14.5px;color:var(--ink);line-height:1.4;margin-top:3px}
.kind-card.on p{color:var(--text2)}
.ch-home{background:color-mix(in srgb,var(--cc) 30%,var(--card))}
.ch-home .tile,.vrow .tile,.ch-act .tile{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.ch-home b{display:block;font-size:14px;line-height:1.35;margin-top:2px}
.ch-home .eyebrow{display:block}
.ch-act .ch-pct{font-size:22px;color:var(--ink)}
.ch-today{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--cc) 28%,var(--card))}
.ch-today small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);font-weight:700}
.ch-today p{font-size:15px;color:var(--ink);margin-top:3px;line-height:1.4}
.ch-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.ch-d{aspect-ratio:1;border-radius:10px;background:var(--bg2);font-size:12px;font-weight:700;color:var(--text2);display:grid;place-items:center}
.ch-d.on{background:var(--cc);color:var(--on-pastel)}
.ch-d.td{box-shadow:inset 0 0 0 2px var(--lav-deep)}
.ch-d.fut{opacity:.45}
.habit.hw{flex-wrap:wrap;row-gap:10px}
.habit.hw .glasses{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding-left:60px}
.habit.hw .gl{width:21px;height:27px}
.wbtns{display:flex;gap:6px;flex:none}
.fz-set{padding:4px 16px}
.fz-set .stepper{gap:8px}
.fz-set .stepper button:disabled{opacity:.4}
.fz-in{display:flex;align-items:baseline;gap:4px;background:var(--bg2);border-radius:12px;padding:6px 10px}
.fz-in input{width:42px;border:0;background:none;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--ink);text-align:center;-moz-appearance:textfield}
.fz-in input::-webkit-inner-spin-button,.fz-in input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fz-in span{font-size:12px;color:var(--text2)}
.gmin{width:34px;height:34px;border-radius:12px;background:var(--bg2);color:var(--text2);font-weight:700;font-size:18px;display:grid;place-items:center}
.gmin:disabled{opacity:.4}
.gl{width:24px;height:30px;border-radius:4px 4px 9px 9px;border:1.8px solid #A9C6EA;background:transparent;position:relative;overflow:hidden;transition:background .3s}
.gl.on{background:linear-gradient(transparent 22%,#BFD7F2 22%)}
.rv-hero{text-align:center;background:linear-gradient(150deg,color-mix(in srgb,var(--lav) 30%,var(--card)),color-mix(in srgb,var(--mint) 30%,var(--card)))}
.rv-big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--ink);margin-top:6px}
.rv-hero p{color:var(--text2)}
.rv-delta{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}
.rv-delta.up{background:#DDF2DE;color:#4F8A5B}
.rv-delta.down{background:#FBE3EA;color:#A0506A}
.rv-a+.rv-a{margin-top:14px}
.rv-a small{font-size:11.5px;color:var(--text2);font-weight:700}
.rv-a p{color:var(--ink);margin-top:3px;white-space:pre-wrap}
.fz{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.fz-ring{position:relative;width:220px;height:220px;margin:6px auto}
.fz-ring svg{width:100%;height:100%}
.fz-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:48px;color:var(--ink);font-variant-numeric:tabular-nums}
.fz .btns{width:100%}
.ins-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.hn{display:block;font-size:12px;color:var(--text2);margin-top:2px}
.lock{position:absolute;inset:0;z-index:80;display:none;background:linear-gradient(160deg,color-mix(in srgb,var(--lav) 35%,var(--bg)),color-mix(in srgb,var(--peach) 28%,var(--bg)));align-items:center;justify-content:center;padding:24px}
.lock.on{display:flex}
.lock-in{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:320px}
.lock-logo{width:64px;height:64px;display:block;margin-bottom:10px}
.lock h2{font-size:22px;color:var(--ink)}
.lock-msg{min-height:20px;margin-top:6px}
.pin-dots{display:flex;gap:14px;margin:18px 0 22px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--lav-deep);transition:background .2s}
.pin-dots i.on{background:var(--lav-deep)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pin-k{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--card) 80%,transparent);font-size:26px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.pin-k.sm{font-size:13px;box-shadow:none;background:transparent;color:var(--text2)}

/* Szokáskövető táblázat (Havi nézet) */
.bj-h{display:flex;align-items:center;gap:10px}
.bj-month{font-size:26px;font-weight:500;margin-top:2px}
.iconbtn:disabled{opacity:.35;cursor:default}
.bj-range{max-width:240px;align-self:center;width:100%}
.bj-best{font-size:16px!important;line-height:1.3!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bj{padding:0;overflow:hidden}
.bj-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--lav) 60%,transparent) transparent}
.bj-t{border-collapse:separate;border-spacing:0;min-width:100%}
.bj.bj-week .bj-t{width:100%}
.bj-t td,.bj-t th{padding:5px 2px;text-align:center;border-bottom:1px solid var(--line)}
.bj-t th[scope="row"],.bj-corner,.bj-grp th{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:6px 10px 6px 14px;min-width:148px;max-width:148px;box-shadow:1px 0 0 var(--line)}
.bj-corner{vertical-align:bottom;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:700;padding-bottom:10px!important}
.bj-rh{display:flex;align-items:center;gap:9px}
.bj-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.bj-lbl{min-width:0;display:flex;flex-direction:column;line-height:1.25;gap:2px;overflow:hidden}
.bj-lbl b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bj-lbl small{font-size:10.5px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bj-meta{display:flex;align-items:center;gap:6px;min-width:0}
.bj-meta small{overflow:hidden;text-overflow:ellipsis}
.bj-mini{width:34px;height:4px;border-radius:4px;background:var(--track);overflow:hidden;flex:none}
.bj-mini i{display:block;height:100%;border-radius:4px;filter:saturate(1.4) brightness(.92)}
.bj-day{vertical-align:bottom;padding:10px 2px 8px!important;background:var(--card)}
.bj-day small{display:block;font-size:9.5px;font-weight:600;color:var(--text2);line-height:1.2}
.bj-day b{display:grid;place-items:center;width:24px;height:24px;margin:3px auto 0;border-radius:50%;font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bj-day.td b{background:var(--lav-deep);color:var(--card)}
.bj-t .we{background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.bj-t .td{background:color-mix(in srgb,var(--lav) 14%,var(--card))}
.bj-t .wk{box-shadow:inset 1px 0 0 var(--line)}
.bj-grp th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);padding-top:12px!important;padding-bottom:6px!important;background:var(--bg2);display:table-cell}
.bj-grp td{background:var(--bg2)}
.bj-gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
.bj-c{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;margin:0 auto;color:var(--on-pastel);transition:transform .2s var(--ease),background .2s}
.bj-c svg.i{stroke-width:2.6}
.bj-c.on{background:var(--hc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 70%,var(--ink) 30%)}
.bj-c.miss{background:color-mix(in srgb,var(--text2) 13%,transparent)}
.bj-c.opt{background:color-mix(in srgb,var(--text2) 6%,transparent)}
.bj-c.off{position:relative}
.bj-c.off::after{content:"";width:4px;height:4px;border-radius:50%;background:color-mix(in srgb,var(--text2) 45%,transparent)}
.bj-c.fut{border:1px dashed color-mix(in srgb,var(--text2) 22%,transparent);cursor:default}
.bj-c:not(:disabled):hover{transform:scale(1.12)}
.bj-c.pop{animation:pop .5s var(--ease)}
.bj.bj-week .bj-c{width:32px;height:32px;border-radius:10px}
.bj.bj-week .bj-day b{width:28px;height:28px;font-size:12.5px}
.bj-sum th,.bj-sum td{background:color-mix(in srgb,var(--bg2) 50%,var(--card))}
.bj-sum:first-of-type th,.bj-sum:first-of-type td{border-top:1px solid var(--line)}
.bj-pct{display:grid;place-items:center;width:24px;height:20px;margin:0 auto;border-radius:6px;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text2)}
.bj-pct.full{background:var(--mint);color:#3F6B48}
.bj-pct.mid{background:color-mix(in srgb,var(--gold) 60%,transparent);color:#6E5426}
.bj-pct.low{background:color-mix(in srgb,var(--peach) 60%,transparent);color:#8A4E33}
.bj-mood{font-size:14px;line-height:22px}
.bj-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:12px;color:var(--text2)}
.bj-legend span{display:inline-flex;align-items:center;gap:6px}
.bj-legend .bj-c{width:16px;height:16px;border-radius:5px;margin:0}
.bj-legend .bj-c svg.i{width:10px;height:10px}
.chk.add{color:var(--lav-deep);border-style:dashed}

/* Frissítési sáv */
.upd{position:absolute;top:12px;left:12px;right:12px;z-index:44;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:22px;animation:notifIn .8s var(--ease)}
.upd>svg.i{color:var(--lav-deep)}
.upd b{display:block;color:var(--ink);font-size:14px}
.upd small{color:var(--text2);font-size:12px}
.upd .btn{padding:10px 16px;font-size:13px}
.upd .iconbtn{width:36px;height:36px}

/* Szokáskövető összesítő kártyák */
.trk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.trk{display:flex;align-items:center;gap:8px;padding:10px;border-radius:16px;text-align:left;min-width:0;background:color-mix(in srgb,var(--c) 12%,var(--card));border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.trk-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.trk.ok .trk-ic{background:var(--c);color:#fff}
.trk-t{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.trk-t small{font-size:10.5px;color:var(--text2)}
.trk-t b{font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.trk-kpi{padding:12px 10px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,transparent);display:flex;flex-direction:column;gap:4px;min-width:0}
.trk-kpi b{font-family:var(--f-display);font-size:22px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.trk-kpi small{font-size:11px;color:var(--text2);line-height:1.25}
@container app (max-width:420px){.trk-grid,.trk-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* „Bloomsette ajánlja” */
.reco{position:relative;padding:16px 16px 14px;border-radius:26px;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 28%,var(--card)),var(--card) 55%);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.reco-head{display:flex;align-items:center;gap:12px}
.reco-mark{width:42px;height:42px;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 8px 18px -12px rgba(176,120,150,.8)}
.reco-mark svg{display:block;width:100%;height:100%}
.reco-head b{font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:600}
.reco-list{background:var(--card);border-radius:18px;padding:0 12px;border:1px solid var(--line)}
.reco-list .li b{color:var(--ink);font-size:14px}
.ret{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text2);transition:background .25s,color .25s}
.ret:hover{background:var(--bg2);color:var(--lav-deep)}
.reco-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--on-pastel)}

/* Életterületek (Szokások főoldal és kategóriaképernyő) */
.area-today .area-pct{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--lav-deep)}
.acards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:16px 14px 14px;border-radius:24px;text-align:left;min-width:0;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 30%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);box-shadow:0 10px 24px -18px rgba(118,96,170,.45);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.acard:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(118,96,170,.55)}
.acard-ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--ac);color:var(--on-pastel);margin-bottom:6px}
.acard b{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--ink);line-height:1.2}
.acard small{font-size:12px;color:var(--text2)}
.acard-bar{display:block;width:100%;height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin-top:6px}
.acard-bar i{display:block;height:100%;border-radius:6px;background:color-mix(in srgb,var(--ac) 80%,var(--lav-deep))}
.acard-today{font-weight:600}
.area-hero-ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--ac);color:var(--on-pastel);box-shadow:0 10px 22px -14px var(--ac)}
.area-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.apick{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:15px;background:var(--bg2);border:1.5px solid transparent;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;min-width:0}
.apick-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--ac);color:var(--on-pastel)}
/* Vision Board: látványos réteg */
.vtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(22px,7vw,28px);min-width:0}
.top:has(.vtitle){gap:6px}
.vacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vact{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;color:var(--ink);min-width:0}
.vact>svg{width:36px;height:36px;padding:9px;border-radius:12px;background:var(--lav-soft);color:var(--lav-deep);flex:none}
.vact span{display:flex;flex-direction:column;min-width:0}
.vact b{font-size:14px}
.vact small{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vact.play{background:linear-gradient(135deg,#3E3063,#7A5C9E);color:#fff;border:0}
.vact.play>svg{background:rgba(255,255,255,.18);color:#fff}
.vact.play small{color:rgba(255,255,255,.75)}
.vhero>*{position:relative;z-index:1}
.vhero>.vh-aur{position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg at 50% 50%,color-mix(in srgb,var(--lav) 55%,transparent),color-mix(in srgb,var(--rose) 60%,transparent),color-mix(in srgb,var(--peach) 55%,transparent),color-mix(in srgb,var(--mint) 45%,transparent),color-mix(in srgb,var(--lav) 55%,transparent));filter:blur(40px);opacity:.75;animation:vaur 18s linear infinite;pointer-events:none}
.vhero>.vh-sp{position:absolute;inset:0;z-index:0;pointer-events:none}
.vh-sp i{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(255,255,255,.9);opacity:0;animation:vtw 3.6s ease-in-out var(--d) infinite}
.vword.shim{background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 38%,#C98DAA 47%,#E8C27A 53%,var(--ink) 62%,var(--ink) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:vshim 5s ease-in-out infinite}
@keyframes vaur{to{transform:rotate(360deg)}}
@keyframes vtw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1)}}
@keyframes vshim{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
.vb .vc:not(.empty){animation:vcin .7s var(--ease) both}
.vb .vc[data-i="1"]{animation-delay:.06s}.vb .vc[data-i="2"]{animation-delay:.12s}.vb .vc[data-i="3"]{animation-delay:.18s}.vb .vc[data-i="4"]{animation-delay:.24s}.vb .vc[data-i="5"]{animation-delay:.3s}.vb .vc[data-i="6"]{animation-delay:.36s}.vb .vc[data-i="7"]{animation-delay:.42s}.vb .vc[data-i="8"]{animation-delay:.48s}.vb .vc[data-i="9"]{animation-delay:.54s}.vb .vc[data-i="10"]{animation-delay:.6s}.vb .vc[data-i="11"]{animation-delay:.66s}.vb .vc[data-i="12"]{animation-delay:.72s}
@keyframes vcin{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.vc .vshine{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);background-size:250% 100%;background-position:150% 0;transition:background-position .9s var(--ease)}
.vc:hover .vshine,.vc:focus-visible .vshine{background-position:-60% 0}
.vc.fav{box-shadow:0 0 0 2px rgba(232,194,122,.85),0 14px 34px -14px rgba(200,150,80,.55)}
.vc>*:not(img):not(.vshine){position:relative;z-index:1}
.vprev{margin-top:4px;border-radius:20px;padding:18px;min-height:84px;display:flex;align-items:flex-end;color:var(--on-pastel);font-family:var(--f-display);font-size:17px;font-weight:500;box-shadow:var(--shadow)}
.vprev.night{color:#F5EFFF}
.vbg-g{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:12px 0 6px}
.vbgs{gap:8px}
.vbgs button{width:38px;height:38px;border-radius:13px}
.vbg-own{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--bg2);cursor:pointer;font-size:13px;color:var(--text);border:1.5px solid transparent}
.vbg-own.on{border-color:var(--lav-deep)}
.vbg-own span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;color:var(--text)}
.vbg-own input{width:42px;height:42px;border:0;border-radius:12px;padding:0;background:none;cursor:pointer;flex:none}
.vbg-own input::-webkit-color-swatch-wrapper{padding:0}.vbg-own input::-webkit-color-swatch{border:0;border-radius:12px}
.modal.vplay{background:#1A1428;overflow:hidden}
.modal.vplay>.vp-card,.modal.vplay>.vp-nav{position:relative;z-index:1}
.modal.vplay>.vp-bars,.modal.vplay>.vp-x{z-index:2}
.modal.vplay>.vp-aur{position:absolute;inset:-30%;z-index:0;background:var(--vbg);filter:blur(70px) saturate(1.5);opacity:.55;animation:vpaur 14s ease-in-out infinite alternate}
.modal.vplay>.vp-sp{position:absolute;inset:0;z-index:0;pointer-events:none}
.vp-sp i{position:absolute;left:var(--x);bottom:-20px;width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 12px 3px rgba(255,240,250,.6);animation:vprise var(--t) linear var(--d) infinite;opacity:0}
@keyframes vpaur{0%{transform:rotate(0) scale(1)}100%{transform:rotate(25deg) scale(1.25)}}
@keyframes vprise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
.vp-card{box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12)}
.vp-card img{animation:vpkb 8s ease-out both}
@keyframes vpkb{from{transform:scale(1.14) translate(2%,1%)}to{transform:scale(1)}}
.vp-card .vw{display:inline-block;opacity:0;transform:translateY(10px);filter:blur(4px);animation:vpw .8s var(--ease) var(--w) forwards}
.vp-note{opacity:0!important;animation:vpw .9s var(--ease) 1.6s forwards}
@keyframes vpw{to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.vh-aur,.vh-sp i,.vword.shim,.vb .vc,.vp-aur,.vp-sp i,.vp-card img,.vp-card .vw,.vp-note{animation:none!important}.vp-card .vw,.vp-note{opacity:1!important;transform:none;filter:none}.vh-sp i{opacity:.6}}
/* Otthon: takarítási terv */
.hm-hero{position:relative;text-align:center;padding:18px 16px 16px;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--peach) 22%,var(--card)),color-mix(in srgb,var(--lav) 26%,var(--card)));box-shadow:var(--shadow)}
.hm-hero h2{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--lav-deep);letter-spacing:.01em}
.hm-hero p{font-size:12.5px;color:var(--text2);font-style:italic;margin-top:2px}
.hm-deco{position:absolute;left:14px;top:12px;font-size:22px}.hm-deco.r{left:auto;right:14px}
.hm-hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hm-hero-stats div{background:color-mix(in srgb,var(--card) 75%,transparent);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column}
.hm-hero-stats b{font-size:17px;color:var(--ink)}.hm-hero-stats small{font-size:10.5px;color:var(--text2)}
.hm-box{padding:0 0 12px;overflow:hidden;border:1.5px solid color-mix(in srgb,#9DB8C9 55%,transparent)}
.hm-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,#CFE2F6 88%,var(--card));color:var(--on-pastel);margin-bottom:8px}
.hm-time .hm-head{background:color-mix(in srgb,#E6DDF7 90%,var(--card))}
.hm-head b{font-size:15px;color:inherit}.hm-head small{font-size:10.5px;font-style:italic;color:inherit;opacity:.72;margin-left:auto;text-align:right}
.hm-badge{margin-left:auto;font-size:18px}.hm-head small+.hm-badge{margin-left:6px}
.hm-grid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,20px);gap:3px;align-items:center;padding:0 12px}
.hm-dh{width:20px;height:20px;border-radius:50%;background:var(--dc);display:grid;place-items:center;font-size:8.5px;font-weight:800;color:var(--on-pastel)}
.hm-dh.td{box-shadow:0 0 0 2px var(--lav-deep)}
.hm-row{padding-top:5px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.hm-row:last-of-type{border-bottom:0}
.hm-t{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;color:var(--ink);line-height:1.25}
.hm-t i{font-style:normal;font-size:15px;flex:none}
.hm-t span{min-width:0;overflow-wrap:anywhere}
.hm-c{width:20px;height:20px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--dc) 70%,var(--text2));background:transparent;display:grid;place-items:center;color:var(--on-pastel);padding:0;transition:transform .2s var(--ease),background .2s}
.hm-c.on{background:var(--dc);border-color:color-mix(in srgb,var(--dc) 60%,var(--ink));transform:scale(1.05)}
.hm-c.td:not(.on){background:color-mix(in srgb,var(--dc) 25%,transparent)}
.hm-c svg.i{width:11px;height:11px;stroke-width:3}
.hm-trow{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--line)}
.hm-trow:last-of-type{border-bottom:0}
.hm-at{width:96px;flex:none;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:var(--bg2);color:var(--ink);font:inherit;font-size:12px}
.hm-trow i{font-style:normal;font-size:16px;flex:none}
.hm-trow span{flex:1;min-width:0}
.hm-x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#F8D9DE;color:#B0485F;flex:none;margin-left:auto;padding:0}
.hm-x svg.i{width:12px;height:12px}
.hm-add{display:inline-flex;align-items:center;gap:4px;margin:8px 12px 0;padding:6px 12px;border-radius:999px;background:var(--lav-soft);color:var(--lav-deep);font-size:12px;font-weight:700}
.hm-days{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hm-day{position:relative;overflow:hidden;border-radius:20px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--dc) 75%,var(--text2) 10%);padding:0 0 12px;min-height:150px;display:flex;flex-direction:column}
.hm-day.td{box-shadow:0 0 0 2px var(--lav-deep),var(--shadow)}
.hm-dhead{display:flex;align-items:center;gap:6px;padding:9px 12px;background:color-mix(in srgb,var(--dc) 70%,var(--card));color:var(--on-pastel)}
.hm-dhead b{font-size:14px}.hm-dhead small{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.6)}
.hm-dhead span{margin-left:auto;font-size:16px}
.hm-list{display:flex;flex-direction:column;gap:6px;padding:10px 10px 0;position:relative;z-index:1}
.hm-li{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--ink);line-height:1.3}
.hm-li span{flex:1;min-width:0;overflow-wrap:anywhere}
.hm-cb{width:16px;height:16px;border-radius:5px;border:1.6px solid color-mix(in srgb,var(--text2) 55%,transparent);flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:#fff;background:var(--card)}
.hm-cb.on{background:#7DBF88;border-color:#7DBF88}
.hm-cb svg.i{width:10px;height:10px;stroke-width:3}
.hm-li:has(.hm-cb.on) span{color:var(--text2);text-decoration:line-through}
.hm-dbar{height:5px;border-radius:5px;background:var(--track);margin:10px 10px 0;overflow:hidden}
.hm-dbar i{display:block;height:100%;background:color-mix(in srgb,var(--dc) 80%,var(--ink) 15%);border-radius:5px;transition:width .6s var(--ease)}
.hm-wm{position:absolute;right:6px;bottom:2px;font-size:44px;opacity:.13;pointer-events:none}
.hm-empty{font-size:11.5px;color:var(--text2);line-height:1.35;font-style:italic}
.hm-day .hm-add{margin:10px 10px 0;align-self:flex-start;position:relative;z-index:1;background:color-mix(in srgb,var(--dc) 45%,var(--card));color:var(--on-pastel);border:1.5px dashed color-mix(in srgb,var(--dc) 80%,var(--text2))}
.hm-done{align-items:center;text-align:center;background:linear-gradient(170deg,var(--card),color-mix(in srgb,#FFE9C9 45%,var(--card)))}
.hm-done .hm-dhead{align-self:stretch}
.hm-house{font-size:46px;margin-top:8px;filter:drop-shadow(0 6px 10px rgba(200,140,80,.3))}
.hm-ring{display:flex;flex-direction:column;margin-top:2px}.hm-ring b{font-family:var(--f-display);font-size:22px;color:var(--ink)}.hm-ring small{font-size:10.5px;color:var(--text2)}
.hm-done p{font-size:12px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.35}
.hm-add.wide{display:flex;justify-content:center;margin:10px 12px 0;padding:10px 14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--lav-deep) 45%,transparent);background:color-mix(in srgb,var(--lav-soft) 70%,transparent);font-size:13px}
.hm-tb{display:flex;align-items:center;gap:7px;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.hm-tb i{font-style:normal;font-size:15px;flex:none}
.hm-tb span{min-width:0;overflow-wrap:anywhere}
.hm-lt{cursor:pointer}
.hm-prev{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--bg2)}
.hm-prev span{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);flex:none}
.hm-prev b{font-size:15px;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.hm-ig{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:10px 0 6px}
.hm-sticky{position:sticky;bottom:-28px;margin:18px -4px -28px;padding:14px 4px 28px;background:linear-gradient(transparent,var(--bg) 30%);z-index:2}
.hm-svg{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.15em}
.hm-emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.hm-emo button{aspect-ratio:1;border-radius:12px;background:var(--bg2);font-size:20px;border:1.5px solid transparent}
.hm-emo button.on{border-color:var(--lav-deep);background:var(--lav-soft)}
.iconbtn.on{background:var(--lav-soft);color:var(--lav-deep)}
/* Pénzügyek */
.fin-month{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fin-month b{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--ink)}
.fin-month .iconbtn:disabled{opacity:.3}
.fin-hero{padding:22px;border-radius:28px;background:linear-gradient(150deg,color-mix(in srgb,var(--lav) 42%,var(--card)),color-mix(in srgb,var(--mint) 38%,var(--card)));color:var(--ink);box-shadow:var(--shadow)}
.fin-hero>small{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.fin-hero>b{display:block;font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fin-hero>b.neg{color:#C2607F}

.fin-st.ok{background:var(--mint);color:#3F6B48}

  .menu{grid-template-columns:repeat(3,1fr)}

  .mlist{grid-template-columns:repeat(3,1fr)}
  .vb{grid-template-columns:repeat(4,1fr)}
  .coll{grid-template-columns:repeat(6,1fr)}
}

/* Évente ismétlődő nap egy adott évben: a február 29. nem szökőévben február 28-ra esik (nem március 1-re) */
function yearDay(y,m,dd){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(dd,last),12)}
function nextYearly(m,dd){const y=now().getFullYear();let d=yearDay(y,m,dd);if(keyOf(d)<TODAY)d=yearDay(y+1,m,dd);return d}
function nextB(c){const d=nextYearly(+c.bday.slice(0,2)-1,+c.bday.slice(3));return{k:keyOf(d),n:dayDiff(keyOf(d),TODAY),age:c.year?d.getFullYear()-c.year:null}}

  const r=rng(42),G=['Végre végigcsináltam az edzést','Megittam a 8 pohár vizet','Elolvastam egy fejezetet','Nyugodt maradtam egy nehéz megbeszélésen','Korán lefeküdtem','Felhívtam anyát'];
  const GR=['A reggeli kávé csendje','Egy kedves üzenet a barátnőmtől','A napsütés a villamoson','Hogy egészséges vagyok','A ma esti közös vacsora','Az őszi levelek színei'];
  const GO=['Nyugodt reggel, telefon nélkül','Délben 20 perc séta','Kedves leszek magamhoz','Befejezem a prezentációt','Több vizet iszom'];

    if(r()<.42)s.checkins[k]={mood:m,goal:GO[Math.floor(r()*GO.length)],grateful:GR[Math.floor(r()*GR.length)]};
    if(r()<.4)s.reflections[k]={done:G[Math.floor(r()*G.length)],proud:['Hogy nem adtam fel','Hogy kimondtam, amit érzek','Hogy időt szántam magamra','A kitartásomra'][Math.floor(r()*4)]};
