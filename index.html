<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="bloomly-version" content="20261031214043">
<link rel="icon" type="image/png" sizes="256x256" href="bloomly-256.png?v=20261031214043">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style><title>Bloomly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Urbanist:wght@300;400;500;600;700&display=swap">
<style>
/* Elrendezés: telefonkeret asztali nézetben, teljes képernyő mobilon; légies pasztell felületek, üvegkártyák, alsó tabsáv. */
:root{
  --bg:#FFFDFB; --bg2:#F8F5F2; --card:#FFFFFF; --text:#556070; --ink:#465064; --text2:#7D879A;
  --lav:#CBB7F7; --lav-deep:#8F78CF; --lav-soft:#F1EBFD; --rose:#F7E5EA; --peach:#FFD6C2; --mint:#CDECCF; --mint-deep:#5E9C6B;
  --gold:#E9D6A7; --gold-deep:#B48F4E; --line:rgba(85,96,112,.09); --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.8);
  --shadow:0 14px 34px -18px rgba(118,96,170,.35),0 2px 6px -2px rgba(118,96,170,.08);
  --desk:#F3EEF6; --frame:#FFFFFF; --sky1:#F4ECFE; --sky2:#FFF1EA; --hill1:#E3F1E1; --hill2:#CDECCF; --pond:#D8E8F6; --trunk:#B9A08C;
  --sun:#F3E3BC; --on-pastel:#4A4360; --track:#EFEAF4;
  --f-display:"Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1925; --bg2:#231F2E; --card:#2A2537; --text:#E3DEEC; --ink:#F1ECF7; --text2:#A69FB8;
  --lav:#B9A3EE; --lav-deep:#CDBBF7; --lav-soft:#332B47; --rose:#3B2E3A; --peach:#E9BBA6; --mint:#A5D3AA; --mint-deep:#A5D3AA;
  --gold:#E0C98F; --gold-deep:#E0C98F; --line:rgba(255,255,255,.07); --glass:rgba(42,37,55,.66); --glass-line:rgba(255,255,255,.08);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.3);
  --desk:#14121B; --frame:#2A2537; --sky1:#2A2440; --sky2:#3A2E45; --hill1:#2E3B35; --hill2:#3B5245; --pond:#33405A; --trunk:#7E6A5E;
  --sun:#EDE3C6; --on-pastel:#2B2538; --track:#352F44; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1925; --bg2:#231F2E; --card:#2A2537; --text:#E3DEEC; --ink:#F1ECF7; --text2:#A69FB8;
  --lav:#B9A3EE; --lav-deep:#CDBBF7; --lav-soft:#332B47; --rose:#3B2E3A; --peach:#E9BBA6; --mint:#A5D3AA; --mint-deep:#A5D3AA;
  --gold:#E0C98F; --gold-deep:#E0C98F; --line:rgba(255,255,255,.07); --glass:rgba(42,37,55,.66); --glass-line:rgba(255,255,255,.08);
  --shadow:0 18px 40px -20px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.3);
  --desk:#14121B; --frame:#2A2537; --sky1:#2A2440; --sky2:#3A2E45; --hill1:#2E3B35; --hill2:#3B5245; --pond:#33405A; --trunk:#7E6A5E;
  --sun:#EDE3C6; --on-pastel:#2B2538; --track:#352F44; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:56px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lav-deep);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.aside{display:none;max-width:320px}
.aside .wm{font-family:var(--f-display);letter-spacing:.34em;font-weight:500;font-size:15px;color:var(--ink)}
.aside h2{font-size:34px;font-weight:400;margin-block:18px 12px;line-height:1.15}
.aside p{color:var(--text2)}
.aside a{color:var(--lav-deep);font-weight:600;text-decoration:none}
@media (min-width:1000px) and (hover:hover) and (pointer:fine){:root:not(.native) .aside{display:block}}

/* A .phone a méretezés alapja: telefonon és tableten kitölti a képernyőt, és a belső elrendezés a saját szélességéhez igazodik (container query).
   Telefonkeret csak asztali böngészőben jelenik meg, az Android appban és az exe-ben soha. */
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;isolation:isolate;container-type:inline-size;container-name:app}
@media (min-width:640px) and (hover:hover) and (pointer:fine){:root:not(.native) .phone{width:402px;height:min(870px,calc(100% - 40px));border-radius:48px;border:9px solid var(--frame);box-shadow:0 40px 80px -40px rgba(90,70,140,.45),0 0 0 1px var(--line)}}
.phone::before{content:"";position:absolute;inset:-20% -30% auto;height:420px;background:radial-gradient(closest-side,color-mix(in srgb,var(--lav) 40%,transparent),transparent),radial-gradient(closest-side at 80% 40%,color-mix(in srgb,var(--peach) 45%,transparent),transparent);opacity:.55;z-index:-1;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 0;display:flex;flex-direction:column;gap:18px}
.screen-in{animation:screenIn .5s var(--ease)}
@keyframes screenIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);font-weight:600}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello h1{font-size:30px;font-weight:500;line-height:1.1;margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--lav),var(--peach));display:grid;place-items:center;color:var(--on-pastel);font-family:var(--f-display);font-weight:600;font-size:17px;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-h h2{font-size:20px;font-weight:600}
.link{color:var(--lav-deep);font-weight:600;font-size:13px}

.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-line);border-radius:28px;box-shadow:var(--shadow)}
.muted{color:var(--text2);font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* Főoldali hero */
.hero{padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink);line-height:1;display:block}
.ring .val span{font-size:11.5px;color:var(--text2)}
.ring circle{transition:stroke-dashoffset 1.1s var(--ease)}
.stat-chips{display:flex;flex-direction:column;gap:10px}
.chip-stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--bg2)}
.chip-stat .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--on-pastel)}
.chip-stat b{font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:600;display:block;line-height:1.15}
.chip-stat small{font-size:11.5px;color:var(--text2)}

/* Check-in */
.checkin{padding:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--lav) 55%,var(--card)),color-mix(in srgb,var(--peach) 50%,var(--card)));border-radius:28px;box-shadow:var(--shadow);color:var(--on-pastel);position:relative;overflow:hidden}
.checkin h3{font-size:22px;color:var(--on-pastel);font-weight:600}
.checkin p{opacity:.8;font-size:13.5px;margin-top:4px}
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:16px}
.mood-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:18px;background:rgba(255,255,255,.55);font-size:11px;color:var(--on-pastel);transition:transform .3s var(--ease),background .3s}
.mood-b .e{font-size:24px;line-height:1}
.mood-b:hover{transform:translateY(-3px)}
.mood-b.on{background:#fff;box-shadow:0 8px 20px -10px rgba(80,60,120,.5);transform:translateY(-3px)}
.moods.plain .mood-b{background:var(--bg2);color:var(--text)}
.moods.plain .mood-b.on{background:var(--lav-soft);outline:1.5px solid var(--lav)}

/* Szokás sorok */
.habits{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px;background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(118,96,170,.4);transition:transform .35s var(--ease),opacity .35s}
.habit .tile{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.habit .name{font-weight:600;color:var(--ink);font-size:15px;line-height:1.25}
.habit .meta{font-size:12.5px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.habit.done .name{color:var(--text2)}
.chk{position:relative;width:38px;height:38px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--lav) 80%,var(--text2));display:grid;place-items:center;flex:none;color:transparent;transition:all .4s var(--ease)}
.chk svg{width:18px;height:18px;stroke-width:2.4}
.habit.done .chk{background:var(--mint);border-color:var(--mint);color:#3F6B48}
.chk .petal{position:absolute;left:50%;top:50%;width:9px;height:14px;margin:-7px 0 0 -4.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--lav);opacity:0;pointer-events:none}
.chk.burst .petal{animation:petal .9s var(--ease) forwards}
@keyframes petal{0%{opacity:.95;transform:rotate(var(--r)) translateY(0) scale(.4)}100%{opacity:0;transform:rotate(var(--r)) translateY(-30px) scale(1)}}
.chk.burst{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}

.quote{padding:22px;position:relative;overflow:hidden}
.quote .q{font-family:var(--f-display);font-size:21px;line-height:1.35;color:var(--ink);font-weight:400;margin-top:10px}
.quote .mark{position:absolute;right:-18px;bottom:-24px;width:120px;opacity:.14;color:var(--lav-deep)}
.quote .acts{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

.garden-prev{padding:0;overflow:hidden}
.garden-prev .meta{padding:14px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--lav),var(--peach));transition:width 1s var(--ease)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--peach))}

.fab{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:100px;width:58px;height:58px;border-radius:22px;background:linear-gradient(145deg,var(--lav),#B6A0EE);color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -12px rgba(140,110,210,.75);z-index:5;transition:transform .3s var(--ease)}
.fab:hover{transform:translateY(-2px) rotate(90deg)}
.fab svg{width:26px;height:26px;stroke-width:2}

.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:70px;display:flex;justify-content:space-around;align-items:center;z-index:6;padding-inline:max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text2);padding:8px 10px;border-radius:18px;transition:color .3s}
.tab.on{color:var(--lav-deep)}
.tab.on svg{stroke-width:1.9}
.tab .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
.tab.on .dot{opacity:1}

/* Fejléc aloldalakon */
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:26px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:15px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 6px 16px -12px rgba(118,96,170,.5);color:var(--ink);flex:none}

.seg{display:flex;background:var(--bg2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text2);transition:all .3s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 12px -8px rgba(80,60,120,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600;color:var(--text);border:1px solid transparent;transition:all .3s}
.chip.on{background:var(--lav-soft);color:var(--lav-deep);border-color:color-mix(in srgb,var(--lav) 70%,transparent)}
.wrapchips{flex-wrap:wrap;overflow:visible}

.week{display:flex;gap:5px;margin-top:8px}
.week i{width:16px;height:6px;border-radius:4px;background:var(--track)}
.week i.y{background:var(--hc,var(--lav))}

/* Lapok (sheet) */
.scrim{position:absolute;inset:0;background:rgba(40,30,60,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;opacity:0;transition:opacity .35s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:32px 32px 0 0;z-index:21;transform:translateY(105%);transition:transform .5s var(--ease);padding:10px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));scrollbar-width:none}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--track);margin:4px auto 16px}
.sheet h2{font-size:23px;font-weight:600;margin-bottom:4px;padding-right:48px}
.sheet-x{position:absolute;top:16px;right:max(18px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:13px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);outline:none;transition:border .3s,box-shadow .3s;color:var(--ink)}
.inp:focus{border-color:var(--lav);box-shadow:0 0 0 4px color-mix(in srgb,var(--lav) 25%,transparent)}
textarea.inp{min-height:92px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:18px;font-weight:700;font-size:15px;background:linear-gradient(145deg,#C7B2F6,#B39CEC);color:#fff;box-shadow:0 14px 26px -14px rgba(140,110,210,.9);transition:transform .25s var(--ease),filter .25s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn.block{width:100%}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--rose);color:#A0526A;box-shadow:none}
.btns{display:flex;gap:10px;margin-top:22px}
.btns .btn{flex:1}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icongrid button{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--bg2);display:grid;place-items:center;color:var(--ink);border:1.5px solid transparent}
.icongrid button.on{border-color:var(--lav);background:var(--lav-soft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--lav-deep)}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:12px;background:var(--bg2);font-size:12.5px;font-weight:700}
.days button.on{background:var(--lav);color:var(--on-pastel)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:14px;background:var(--bg2);font-size:20px;color:var(--ink)}
.stepper b{font-family:var(--f-display);font-size:22px;color:var(--ink);min-width:24px;text-align:center}

/* Hőtérkép */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;overflow-x:auto}
.heat i{width:16px;height:16px;border-radius:5px;background:var(--track)}
.heat i.l1{background:color-mix(in srgb,var(--lav) 40%,var(--track))}
.heat i.l2{background:color-mix(in srgb,var(--lav) 70%,var(--track))}
.heat i.l3{background:var(--lav)}
.heat i.l4{background:var(--lav-deep)}

/* Kert */
.garden svg{display:block;width:100%;height:auto}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.bloom-new .head{transform-box:fill-box;transform-origin:50% 50%;animation:bloomIn 1.6s var(--ease) both}
@keyframes bloomIn{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.fly{animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30px,-14px)}50%{transform:translate(60px,4px)}75%{transform:translate(26px,12px)}100%{transform:translate(0,0)}}
.wing{transform-box:fill-box;transform-origin:50% 50%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.ripple{animation:ripple 4s ease-in-out infinite}
@keyframes ripple{50%{opacity:.4}}
.glow{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.item .art{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.item b{font-size:12.5px;color:var(--ink);line-height:1.2}
.item small{font-size:10.5px;color:var(--text2);line-height:1.25}
.item.locked .art{filter:grayscale(1);opacity:.45}
.rar{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:999px}
.rar.k{background:var(--mint);color:#3F6B48}.rar.r{background:var(--lav-soft);color:var(--lav-deep)}.rar.s{background:var(--peach);color:#8A4E33}.rar.l{background:var(--gold);color:#6E5426}

/* Ciklus */
.cyc{display:grid;place-items:center;position:relative}
.cyc svg{width:250px;height:250px;max-width:100%}
.cyc .mid{position:absolute;text-align:center}
.cyc .mid b{font-family:var(--f-display);font-size:44px;font-weight:500;color:var(--ink);line-height:1;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:12px;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11px;color:var(--text2);font-weight:700}
.cal span{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:12px;font-size:13px;font-variant-numeric:tabular-nums}
.cal .p{background:#F7CBD6;color:#7A3C50}.cal .pp{border:1.5px dashed #E9A8B8}.cal .f{background:var(--mint);color:#3F6B48}.cal .o{background:var(--peach);color:#8A4E33}.cal .t{box-shadow:0 0 0 2px var(--lav-deep)}
.cal .x{opacity:.0}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--on-pastel)}
.energy{display:flex;gap:8px}
.energy button{flex:1;height:44px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;color:var(--text2);font-weight:700}
.energy button.on{background:var(--gold);color:#6E5426}

/* Statisztika */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--ink);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--text2)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text2);font-size:10px;font-family:var(--f-body)}
.chart .barr{transition:opacity .2s;cursor:pointer}
.chart .barr:hover{opacity:.8}
.cons{display:flex;flex-direction:column;gap:12px}
.insight{display:flex;gap:12px;padding:14px;border-radius:20px;background:var(--lav-soft);color:var(--ink);font-size:13.5px}

/* Vision board */
.vb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vc{position:relative;border-radius:24px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);color:var(--on-pastel);overflow:hidden;isolation:isolate;touch-action:pan-y;transition:transform .3s var(--ease)}
.vc.dragging{opacity:.85;transform:scale(1.04);z-index:3;box-shadow:0 30px 50px -20px rgba(80,60,120,.6)}
.vc.tall{grid-row:span 2}
.vc .t{font-family:var(--f-display);font-size:18px;line-height:1.3;font-weight:500}
.vc .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.7}
.vc .tools{display:flex;justify-content:space-between;align-items:center}
.vc .tools button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.5);color:var(--on-pastel)}
.vc .grip{cursor:grab;touch-action:none}
.vc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.vc.img{color:#fff}
.vc.img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(30,20,40,.55));z-index:-1}
.vc.empty{border:2px dashed color-mix(in srgb,var(--lav) 70%,transparent);background:var(--card);box-shadow:none;color:var(--text2);align-items:center;justify-content:center;text-align:center;gap:8px}

/* Jelvények */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 6px;border-radius:22px;background:var(--card);border:1px solid var(--line);min-width:0}
.badge svg{width:64px;height:64px}
.badge b{font-size:12.5px;color:var(--ink);line-height:1.2}
.badge small{font-size:10.5px;color:var(--text2)}
.badge.locked svg{filter:grayscale(1);opacity:.35}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}

/* Lista elemek a profilban */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mi{padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 18px -14px rgba(118,96,170,.4);transition:transform .3s var(--ease)}
.mi:hover{transform:translateY(-2px)}
.mi .ic{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:var(--on-pastel)}
.mi b{color:var(--ink);font-size:15px;display:block}
.mi small{color:var(--text2);font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.switch{width:50px;height:30px;border-radius:30px;background:var(--track);position:relative;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .35s var(--ease)}
.switch.on{background:var(--lav)}
.switch.on::after{transform:translateX(20px)}
.notif{display:flex;gap:12px;padding:14px;border-radius:22px;align-items:flex-start}
.notif .ap{width:38px;height:38px;border-radius:11px;flex:none}
.entry{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.entry .q{font-size:12px;color:var(--text2);font-weight:600}
.entry p{color:var(--ink);font-size:14.5px}

/* Onboarding */
.ob{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:26px max(24px,env(safe-area-inset-right,0px)) 26px max(24px,env(safe-area-inset-left,0px));overflow-y:auto}
.ob::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 20% 10%,color-mix(in srgb,var(--lav) 45%,transparent),transparent),radial-gradient(50% 35% at 90% 30%,color-mix(in srgb,var(--peach) 45%,transparent),transparent),radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,var(--mint) 45%,transparent),transparent);z-index:-1;pointer-events:none}
.ob .prog{display:flex;gap:6px}
.ob .prog i{flex:1;height:4px;border-radius:4px;background:var(--track);transition:background .5s}
.ob .prog i.on{background:var(--lav)}
.ob{overflow-x:hidden}
.ob .body{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:14px;padding-block:22px}
.ob .body.fwd{animation:obFwd .55s var(--ease)}
.ob .body.bk{animation:obBk .55s var(--ease)}
@keyframes obFwd{from{opacity:0;transform:translateX(34px)}}
@keyframes obBk{from{opacity:0;transform:translateX(-34px)}}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-bar{flex:1;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.ob-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--lav),var(--peach));transition:width .7s var(--ease)}
.ob-count{font-size:12px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.ob-link{margin-top:14px;align-self:center}
.ob-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.ob-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.ob-pills span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:12.5px;font-weight:600;color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:screenIn .7s var(--ease) backwards}
.ob-pills span:nth-child(2){animation-delay:.12s}.ob-pills span:nth-child(3){animation-delay:.24s}
.ob-pills svg.i{color:var(--lav-deep)}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{position:relative;padding:18px 12px 16px;border-radius:22px;background:var(--glass);border:1.5px solid var(--glass-line);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s var(--ease),border-color .3s,background .3s}
.area .tile{width:46px;height:46px;border-radius:16px;margin-bottom:2px;display:grid;place-items:center;color:var(--on-pastel);background:var(--ac)}
.area b{color:var(--ink);font-size:14.5px}
.area small{font-size:11.5px;color:var(--text2);line-height:1.35}
.area:hover{transform:translateY(-2px)}
.area-grid.three{grid-template-columns:repeat(3,1fr);gap:8px}
.area.sm{padding:14px 6px 12px;gap:6px;border-radius:18px}
.area.sm .tile{width:38px;height:38px;border-radius:13px;margin-bottom:0}
.area.sm b{font-size:12.5px;line-height:1.25}
.area.sm .tick{top:6px;right:6px;width:18px;height:18px}
.area.on{border-color:color-mix(in srgb,var(--ac) 70%,var(--lav-deep));background:color-mix(in srgb,var(--ac) 32%,var(--card));transform:translateY(-2px)}
.area .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--lav-deep);color:var(--card);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease)}
.area.on .tick{transform:scale(1)}
.gnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--card);background:transparent;border:1.5px dashed color-mix(in srgb,var(--text2) 50%,transparent);flex:none;transition:all .3s var(--ease)}
.goal.on .gnum{background:var(--lav-deep);border:0}
.ob-chk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid color-mix(in srgb,var(--lav) 80%,var(--text2));color:#3F6B48;transition:all .3s var(--ease)}
.opt.on .ob-chk{background:var(--mint);border-color:var(--mint)}
.ob-count-pill{align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--lav-soft);color:var(--lav-deep);font-size:12.5px;font-weight:700}
.ob-count-pill.warn{background:var(--peach);color:#8A4E33}
.lf-wrap{display:grid;place-items:center}
.lf{width:100%;max-width:290px;display:block;margin:0 auto;overflow:visible}
.lf.sm{width:58px;height:58px;max-width:58px;margin:0}
.lf-p{transform-box:view-box;transform-origin:0 0;transition:transform .6s var(--ease);cursor:pointer}
.lf-p.grow{animation:lfGrow 1.1s var(--ease) backwards}
@keyframes lfGrow{from{transform:scale(0)}}
.lf-g.sel .lf-p{stroke:var(--lav-deep);stroke-width:2.5;vector-effect:non-scaling-stroke}
.lf-ic{cursor:pointer}
.lf-ic circle{transition:r .3s}
.lf-ic.sel circle{stroke:var(--lav-deep);stroke-width:2.5}
.lf-avg{font-family:var(--f-display);font-size:15px;font-weight:700;fill:#5A4A2A}
.lf-panel{display:flex;flex-direction:column;gap:12px}
.lf-val{font-family:var(--f-display);font-size:30px;color:var(--ink);font-weight:600;line-height:1}
.lf-val small{font-size:14px;color:var(--text2);font-weight:500}
#lfr{width:100%;accent-color:var(--lav-deep);height:28px;cursor:pointer}
.lf-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:-6px}
.lf-dots{display:flex;justify-content:space-between;gap:4px}
.lf-dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--on-pastel);border:2px solid transparent;transition:transform .3s var(--ease)}
.lf-dot.on{border-color:var(--lav-deep);transform:translateY(-2px)}
.ob-garden{border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.ob-garden svg{display:block;width:100%;height:auto}
.bloom-new .head{animation-delay:var(--d,0s)}
.ob-tip{animation:screenIn .6s var(--ease) backwards}
.ob-phases{display:flex;gap:6px}
.ob-phases span{flex:1;text-align:center;padding:8px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--on-pastel)}
.mood-big{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood-big button{padding:14px 2px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glass-line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink);min-width:0;transition:transform .35s var(--ease),background .3s,border-color .3s}
.mood-big .e{font-size:30px;line-height:1;transition:transform .35s var(--ease)}
.mood-big button:hover .e{transform:scale(1.12)}
.mood-big button.on{transform:translateY(-4px);border-color:var(--lav);background:var(--lav-soft)}
.mood-big button.on .e{transform:scale(1.15)}
.mood-reply{animation:screenIn .5s var(--ease)}
.notif-demo{animation:notifIn .9s var(--ease) .25s backwards}
@keyframes notifIn{from{opacity:0;transform:translateY(-18px) scale(.96)}}
.theme-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{border-radius:18px;padding:8px 8px 10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:8px;text-align:center;font-size:12px;font-weight:600;color:var(--ink);min-width:0;transition:transform .3s var(--ease),border-color .3s}
.tcard.on{border-color:var(--lav-deep);transform:translateY(-2px)}
.tprev{height:84px;border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.tprev i{height:10px;border-radius:5px;display:block}
.flower-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fp{border-radius:18px;background:var(--glass);border:1.5px solid var(--glass-line);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink);min-width:0;transition:transform .3s var(--ease),border-color .3s}
.fp.on{border-color:var(--lav-deep);background:var(--lav-soft);transform:translateY(-2px)}
.seed{animation:float 2.4s ease-in-out infinite}
.plant-btn{position:relative;overflow:hidden;width:100%;padding:17px;border-radius:20px;background:var(--lav-soft);color:var(--lav-deep);font-weight:700;border:1.5px solid var(--lav);user-select:none;-webkit-user-select:none;touch-action:none}
.plant-btn i{position:absolute;inset:0 auto 0 0;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,#C7B2F6,#A88EE6)}
.plant-btn span{position:relative;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.plant-btn.full span{color:#fff}
.ob-final-flower{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent),transparent 70%);animation:float 6s ease-in-out infinite}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-lf{display:flex;align-items:center;gap:10px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:saturate(.6)}
.ob h1{font-size:32px;font-weight:500;line-height:1.12}
.ob .lead{color:var(--text2);font-size:15.5px}
.ob .foot{display:flex;gap:10px;align-items:center}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glass-line);text-align:left;width:100%;transition:all .3s var(--ease);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opt.on{border-color:var(--lav);background:color-mix(in srgb,var(--lav-soft) 85%,transparent)}
.opt .tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.opt b{color:var(--ink);font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.logo-big{width:124px;height:124px;border-radius:34px;box-shadow:0 28px 54px -24px rgba(176,120,150,.75),0 2px 8px -2px rgba(176,120,150,.25);animation:float 6s ease-in-out infinite}
.logo-big svg{display:block;width:100%;height:100%}
.brand-wm{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:46px;font-weight:500;letter-spacing:.16em;line-height:1;margin-right:-.16em;color:color-mix(in srgb,#74505F 72%,var(--ink))}
.brand-tag{display:flex;align-items:center;gap:10px;margin-top:-4px;font-size:10.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#B08D57}
.brand-tag i{width:30px;height:1px;background:currentColor;opacity:.7}
@keyframes float{50%{transform:translateY(-8px)}}
.wordmark{font-family:var(--f-display);letter-spacing:.38em;font-weight:500;color:var(--ink);font-size:15px}

/* Effektek */
.fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fall{position:absolute;top:-20px;width:12px;height:16px;border-radius:60% 0 60% 0;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px var(--gold);animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{transform:scale(0);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.modal{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:24px;background:rgba(40,30,60,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--bg);border-radius:32px;padding:30px 24px 24px;text-align:center;width:100%;max-width:330px;animation:rise .7s var(--ease);box-shadow:var(--shadow)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
.modal .medal{width:130px;height:130px;margin:0 auto 10px;border-radius:50%}
.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-140%);z-index:45;padding:12px 18px;border-radius:18px;font-size:13.5px;font-weight:600;color:var(--ink);transition:transform .5s var(--ease);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.steps-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps-dots i{width:7px;height:7px;border-radius:50%;background:var(--track)}
.steps-dots i.on{background:var(--lav-deep);width:20px;border-radius:7px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty-note{padding:22px;text-align:center;color:var(--text2);font-size:13.5px}

/* Bullet journal havi szokáskövető */
.bj-h{display:flex;align-items:center;gap:10px}
.bj-month{font-size:27px;font-weight:500;text-transform:capitalize;margin-top:2px}
.bj-month span{color:var(--text2);font-weight:400}
.iconbtn:disabled{opacity:.35;cursor:default}
.bj{padding:10px 0 12px;overflow:hidden;background-image:radial-gradient(circle,color-mix(in srgb,var(--text2) 26%,transparent) 1px,transparent 1.4px);background-size:14px 14px}
.bj-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--lav) 60%,transparent) transparent}
.bj-t{border-collapse:separate;border-spacing:0}
.bj-t td,.bj-t th{padding:4px 2px;text-align:center}
.bj-t th[scope="row"],.bj-corner{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:5px 10px 5px 14px;min-width:152px;max-width:152px;box-shadow:8px 0 12px -10px rgba(60,40,90,.35)}
.bj-corner{vertical-align:bottom;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:700;padding-bottom:10px!important}
.bj-rh{display:flex;align-items:center;gap:9px}
.bj-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.bj-lbl{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bj-lbl b{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bj-lbl small{font-size:10.5px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bj-day{vertical-align:bottom;padding-bottom:8px!important}
.bj-day small{display:block;font-size:9.5px;font-weight:600;color:var(--text2);line-height:1.2}
.bj-day b{display:grid;place-items:center;width:23px;height:23px;margin:2px auto 0;border-radius:50%;font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bj-t .we{background:color-mix(in srgb,var(--lav) 8%,transparent)}
.bj-t .td{background:color-mix(in srgb,var(--lav) 22%,transparent)}
.bj-day.td b{background:var(--lav-deep);color:var(--card)}
.bj-t .wk{box-shadow:inset 1px 0 0 color-mix(in srgb,var(--text2) 30%,transparent)}
.bj-c{width:20px;height:20px;border-radius:50%;display:block;margin:0 auto;border:1.5px solid color-mix(in srgb,var(--hc) 75%,var(--text2));transition:transform .25s var(--ease),background .25s}
.bj-c.on{background:var(--hc);border-color:color-mix(in srgb,var(--hc) 82%,var(--ink))}
.bj-c.off{border-style:dashed;opacity:.45}
.bj-c.fut{opacity:.22;cursor:default}
.bj-c:not(:disabled):hover{transform:scale(1.18)}
.bj-c.pop{animation:pop .5s var(--ease)}
.bj-sep th,.bj-sep td{border-top:1px dashed color-mix(in srgb,var(--text2) 40%,transparent);padding-top:8px}
.bj-mood{font-size:13px;line-height:20px}
.bj-bar{display:block;width:8px;height:22px;margin:0 auto;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.bj-bar i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:linear-gradient(var(--lav),var(--lav-deep))}
.bj-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:12px;color:var(--text2)}
.bj-legend span{display:inline-flex;align-items:center;gap:6px}
.bj-legend .bj-c{width:14px;height:14px;margin:0}
.bj-legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid color-mix(in srgb,var(--lav) 40%,transparent)}
.bj-legend .sw.we{background:color-mix(in srgb,var(--lav) 14%,var(--card))}
.bj-legend .sw.td{background:color-mix(in srgb,var(--lav) 35%,var(--card))}
.chk.add{color:var(--lav-deep);border-style:dashed}

/* Frissítési sáv */
.upd{position:absolute;top:12px;left:12px;right:12px;z-index:44;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:22px;animation:notifIn .8s var(--ease)}
.upd>svg.i{color:var(--lav-deep)}
.upd b{display:block;color:var(--ink);font-size:14px}
.upd small{color:var(--text2);font-size:12px}
.upd .btn{padding:10px 16px;font-size:13px}
.upd .iconbtn{width:36px;height:36px}

/* Menüsorok (Én fül) */
.mlist{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:10px 16px;border-radius:15px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);color:var(--ink);font-weight:600;font-size:15px;text-align:left;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.mrow:hover{transform:translateX(3px);box-shadow:0 10px 22px -16px var(--c)}
.mrow svg.i{color:var(--c);stroke-width:1.5}
.mrow small{font-size:12px;color:var(--text2);font-weight:500;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.mtile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--c)}
.mtile.sm{width:32px;height:32px;border-radius:11px;font-weight:700;font-size:13px}
.chk.on{background:var(--mint);border-color:var(--mint);color:#3F6B48}
.wplan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;border-radius:14px;background:var(--bg2);border:1.5px solid transparent;min-width:0}
.wday small{font-size:10.5px;color:var(--text2);font-weight:600}
.wday b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.wday span{height:14px;color:#3F6B48}
.wday.ok{background:var(--mint)}
.wday.today b{color:var(--lav-deep)}
.wday.on{border-color:var(--lav);background:var(--lav-soft)}
.wday.on.ok{background:color-mix(in srgb,var(--mint) 70%,var(--lav-soft))}
.dots14{display:flex;gap:5px;margin-top:12px}
.dots14 i{flex:1;height:22px;border-radius:7px}
.medbox{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:22px}
.breath{width:210px;height:210px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 75%,transparent) 30%,color-mix(in srgb,var(--lav) 45%,transparent) 70%,transparent 72%);transform:scale(.74);transition:transform 4s ease-in-out}
.breath[data-ph="in"]{transform:scale(1)}
.breath .core{width:132px;height:132px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center;text-align:center;box-shadow:var(--shadow)}
.breath b{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;display:block}
.breath span{font-size:12px;color:var(--text2)}

    s.habits.forEach((h,hi)=>{if(!scheduledOn(h,d))return;const p=[.86,.78,.72,.66,.7,.8,.62][hi%7]+trend;if(r()<p)done.push(h.id)});

    const ratio=done.filter(id=>{const h=s.habits.find(x=>x.id===id);return h.freq!=='weekly'}).length/daily;
    let m=ratio>.85?0:ratio>.65?1:ratio>.45?2:3;if(r()<.18)m=Math.min(4,m+ (r()<.5?1:2));if(r()<.12)m=Math.max(0,m-1);
    s.moods[k]={m,energy:Math.max(1,Math.min(5,Math.round(5-m*0.8+(r()-.5)))),note:''};
    if(r()<.42)s.checkins[k]={mood:m,goal:GO[Math.floor(r()*GO.length)],grateful:GR[Math.floor(r()*GR.length)]};
    if(r()<.4)s.reflections[k]={done:G[Math.floor(r()*G.length)],proud:['Hogy nem adtam fel','Hogy kimondtam, amit érzek','Hogy időt szántam magamra','A kitartásomra'][Math.floor(r()*4)]};
  }
  s.cycle.starts.forEach(st=>{for(let j=0;j<5;j++){const k=keyOf(addDays(parseK(st),j));s.cycle.days[k]={sym:j<2?['Görcsök','Fáradtság']:['Fáradtság'],energy:j<2?2:3,flow:j<2?'erős':'közepes'}}});
  s.log[TODAY]=s.habits.slice(0,2).map(h=>h.id);
  s.seen=allBadges(s).filter(b=>b.got).map(b=>b.id);
}

/* ───────── Számítások ───────── */
function scheduledOn(h,d){if(h.freq==='daily'||h.freq==='weekly')return true;return h.days.includes(wd(d))}
const isDone=(h,k)=>(S.log[k]||[]).includes(h.id);
function weekCount(h,k){const d=parseK(k),st=addDays(d,-wd(d));let c=0;for(let i=0;i<7;i++){const kk=keyOf(addDays(st,i));if((S.log[kk]||[]).includes(h.id))c++}return c}
function dayRate(k,s=S){const d=parseK(k);const hs=s.habits.filter(h=>h.freq!=='weekly'&&scheduledOn(h,d));if(!hs.length)return null;return hs.filter(h=>(s.log[k]||[]).includes(h.id)).length/hs.length}
const active=(k,s=S)=>(s.log[k]||[]).length>0;
function curStreak(s=S){let d=now();if(!active(keyOf(d),s))d=addDays(d,-1);let c=0;while(active(keyOf(d),s)){c++;d=addDays(d,-1)}return c}
function longestStreak(s=S){const ks=Object.keys(s.log).filter(k=>s.log[k].length).sort();let best=0,run=0,prev=null;ks.forEach(k=>{run=prev&&dayDiff(k,prev)===1?run+1:1;best=Math.max(best,run);prev=k});return best}
function habitStreak(h){let d=now();if(!isDone(h,keyOf(d)))d=addDays(d,-1);let c=0,guard=0;while(guard++<400){if(!scheduledOn(h,d)||h.freq==='weekly'){d=addDays(d,-1);if(h.freq==='weekly')break;continue}if(isDone(h,keyOf(d))){c++;d=addDays(d,-1)}else break}return c}
function totalDone(s=S){return Object.values(s.log).reduce((a,v)=>a+v.length,0)}
function perfectDays(s=S){return Object.keys(s.log).filter(k=>dayRate(k,s)===1).length}
function petals(s=S){return totalDone(s)*10+Object.keys(s.checkins).length*15+Object.keys(s.reflections).length*15+Object.keys(s.moods).length*5}
const LEVELS=[[0,'Mag'],[200,'Csíra'],[600,'Bimbó'],[1200,'Virágzó'],[2000,'Kert'],[3200,'Liget'],[5000,'Édenkert'],[8000,'Bloom Paradicsom']];
function level(p=petals()){let i=0;LEVELS.forEach((l,j)=>{if(p>=l[0])i=j});const nx=LEVELS[i+1];return{i,name:LEVELS[i][1],from:LEVELS[i][0],to:nx?nx[0]:LEVELS[i][0],next:nx?nx[1]:null}}
function rangeRate(n){let a=0,b=0;for(let i=0;i<n;i++){const k=keyOf(addDays(now(),-i));const d=parseK(k);S.habits.forEach(h=>{if(h.freq==='weekly'||!scheduledOn(h,d))return;b++;if(isDone(h,k))a++})}return b?a/b:0}

/* Ciklus */
function cycInfo(k=TODAY){
  const L=S.cycle.length,P=S.cycle.period,st=S.cycle.starts.filter(x=>x<=k).sort().pop();
  if(!st)return null;let day=dayDiff(k,st)+1;const late=day>L;const dd=((day-1)%L)+1;
  const ov=L-14;const ph=dd<=P?'men':dd<ov-1?'fol':dd<=ov+1?'ovu':'lut';
  const next=keyOf(addDays(parseK(st),L*Math.ceil(day/L)));
  return{day:dd,raw:day,ph,L,P,ov,start:st,next,late,toNext:dayDiff(next,k)}
}

/* Jelvények */
function allBadges(s=S){
  const L=longestStreak(s),T=totalDone(s),C=Object.keys(s.checkins).length,R=Object.keys(s.reflections).length,PD=perfectDays(s),M=Object.keys(s.moods).length;
  return[

}

function flower(x,y,s,type,col,delay=0,isNew){
  let head='';const H=24;
  if(type==='lav'){for(let i=0;i<7;i++)head+=`<ellipse cx="${i%2?1.5:-1.5}" cy="${-H-2+i*3}" rx="2.1" ry="2.7" fill="${i<2?'#D9CBFA':'#B9A3EE'}"/>`}
  else if(type==='daisy'){for(let i=0;i<10;i++)head+=`<ellipse cx="0" cy="${-H-5}" rx="1.5" ry="4.6" fill="#FFFFFF" stroke="#EDE6F5" stroke-width=".4" transform="rotate(${i*36} 0 ${-H})"/>`;head+=`<circle cy="${-H}" r="2.6" fill="#E9C97E"/>`}
  else if(type==='poppy'){for(let i=0;i<5;i++)head+=`<circle cx="0" cy="${-H-3.6}" r="4.2" fill="#FFC9B3" transform="rotate(${i*72} 0 ${-H})"/>`;head+=`<circle cy="${-H}" r="2.2" fill="#8D7B9E"/>`}
  else if(type==='tulip'){head=`<path d="M-5 ${-H-7}c0 6 2 8 5 8s5-2 5-8l-2.5 3L0 ${-H-9}l-2.5 5.5z" fill="${col}"/>`}
  else{for(let i=0;i<5;i++)head+=`<ellipse cx="0" cy="${-H-4}" rx="3.3" ry="4.8" fill="${col}" transform="rotate(${i*72} 0 ${-H})"/>`;head+=`<circle cy="${-H}" r="2.2" fill="#E2C27F"/>`}
  return`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(2)})" class="${isNew?'bloom-new':''}"><g class="sway" style="animation-delay:-${delay.toFixed(1)}s"><path d="M0 0C1 -8 -1 -16 0 ${-H}" stroke="#8DBE95" stroke-width="1.6" fill="none"/><path d="M0 -8c4-1 6-4 7-7-4 0-6 2-7 7z" fill="#A9D6AE"/><g class="head">${head}</g></g></g>`
}
function gardenSVG(compact){
  const u=Object.fromEntries(unlocks().map(x=>[x.id,x.got]));const T=totalDone();
  const W=360,Hh=compact?200:270,gy=compact?118:150;
  const r=rng(7);let o=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Bloom Kert: ${T} virágzó szokásból nőtt kert"><defs><linearGradient id="sky${compact?'c':'f'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>`;
  o+=`<rect width="${W}" height="${Hh}" fill="url(#sky${compact?'c':'f'})"/>`;
  o+=`<circle cx="300" cy="${compact?40:52}" r="20" style="fill:var(--sun)" class="glow"/><circle cx="300" cy="${compact?40:52}" r="34" style="fill:var(--sun)" opacity=".25"/>`;
  o+=`<path d="M0 ${gy}C60 ${gy-34} 120 ${gy-30} 190 ${gy-12}S300 ${gy-40} 360 ${gy-20}V${Hh}H0z" style="fill:var(--hill1)"/>`;
  o+=`<path d="M0 ${gy+18}C80 ${gy-4} 160 ${gy+6} 230 ${gy+2}S330 ${gy-6} 360 ${gy+6}V${Hh}H0z" style="fill:var(--hill2)"/>`;
  if(u.oak)o+=`<g transform="translate(318 ${gy+10})"><g class="sway" style="animation-duration:9s"><path d="M-4 0l1-34h6l1 34z" style="fill:var(--trunk)"/><circle cy="-48" r="22" fill="#B9DDBE"/><circle cx="-14" cy="-38" r="14" fill="#A9D6AE"/><circle cx="14" cy="-38" r="15" fill="#C6E6C8"/></g></g>`;
  if(u.tree){o+=`<g transform="translate(62 ${gy+14})"><g class="sway" style="animation-duration:8s"><path d="M-3.5 0C-2 -14 -6 -24 -12 -32M-3.5 0l1 -40M0 -26c6-6 12-8 16-8" stroke="var(--trunk)" style="stroke:var(--trunk)" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-14" cy="-40" r="16" fill="#F5D3DC"/><circle cx="6" cy="-50" r="19" fill="#F9E1E8"/><circle cx="20" cy="-36" r="13" fill="#F2C6D3"/>${[...Array(9)].map((_,i)=>`<circle cx="${-26+i*6}" cy="${-56+((i*7)%22)}" r="1.6" fill="#fff"/>`).join('')}</g></g>`}
  if(u.lantern&&u.tree){o+=`<path d="M78 ${gy-26}Q140 ${gy-8} 200 ${gy-22}" stroke="#C9B9A6" stroke-width=".8" fill="none"/>`+[96,120,146,172,194].map((x,i)=>`<g><circle cx="${x}" cy="${gy-19+(i%2)*3}" r="6" fill="#FFD6C2" opacity=".35" class="glow"/><rect x="${x-3}" y="${gy-23+(i%2)*3}" width="6" height="8" rx="3" fill="${i%2?'#FFD6C2':'#F7CBD6'}"/></g>`).join('')}
  let pond=null;
  if(u.pond&&!compact){pond={x:238,y:gy+56,rx:58,ry:15};o+=`<ellipse cx="${pond.x}" cy="${pond.y}" rx="${pond.rx}" ry="${pond.ry}" style="fill:var(--pond)"/><ellipse cx="${pond.x}" cy="${pond.y}" rx="${pond.rx-14}" ry="${pond.ry-6}" fill="#fff" opacity=".25" class="ripple"/><ellipse cx="${pond.x-24}" cy="${pond.y+2}" rx="9" ry="3.5" fill="#A9D6AE"/><ellipse cx="${pond.x+20}" cy="${pond.y-3}" rx="8" ry="3" fill="#A9D6AE"/><g transform="translate(${pond.x+20} ${pond.y-4})">${[0,60,120,180,240,300].map(a=>`<ellipse cy="-3" rx="2" ry="4" fill="${u.gl?'#E9D6A7':'#F7E5EA'}" transform="rotate(${a})"/>`).join('')}<circle r="1.6" fill="#E2C27F"/></g>`}
  if(u.bush)o+=[[150,gy+6],[24,gy+12]].map(([x,y])=>`<g transform="translate(${x} ${y})"><circle cx="-9" cy="-6" r="10" fill="#B9DDBE"/><circle cx="8" cy="-7" r="11" fill="#A9D6AE"/><circle cy="-13" r="10" fill="#C6E6C8"/>${[[-10,-12],[2,-18],[10,-9],[-3,-6]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="3.4" fill="#CFE2F6"/>`).join('')}</g>`).join('');
  if(u.bench&&!compact)o+=`<g transform="translate(118 ${gy+30})"><rect x="-18" y="-9" width="36" height="3" rx="1.5" fill="#D9C4AE"/><rect x="-18" y="-15" width="36" height="3" rx="1.5" fill="#E8D9C8"/><rect x="-15" y="-6" width="2" height="7" fill="#C2AA93"/><rect x="13" y="-6" width="2" height="7" fill="#C2AA93"/></g>`;
  const types=['lav','rose'];if(u.tulip)types.push('tulip');if(u.poppy)types.push('poppy');if(u.daisy)types.push('daisy');
  const cols=S.habits.map(h=>COLORS[h.color]);const n=Math.min(T,compact?34:80);const pts=[];
  for(let i=0;i<n;i++){let x,y,t=0;do{x=10+r()*340;y=gy+22+r()*(Hh-gy-30);t++}while(pond&&((x-pond.x)**2/(pond.rx+8)**2+(y-pond.y)**2/(pond.ry+10)**2)<1&&t<20);pts.push({x,y,i})}

  return o+'</svg>'
}

  const c=cycInfo(),ph=PHASES[c.ph],dd=S.cycle.days[TODAY]||{sym:[],energy:0};

  <button class="btn block" data-a="periodStart">Ma kezdődött a menstruációm</button>

   <div class="sec-h" style="margin-top:16px"><h2 style="font-size:16px">Öngondoskodás</h2></div><div class="tips" style="margin-top:10px">${ph.care.map(t=>`<div class="tip"><span class="ic" style="background:var(--rose)">${ic('heart',18)}</span><p>${t}</p></div>`).join('')}</div>

stats(){
  const N=S.ui.range;const rate=rangeRate(N),cs=curStreak(),ls=longestStreak();
  const days=[...Array(7)].map((_,i)=>{const k=keyOf(addDays(now(),i-6));return{l:WD[wd(parseK(k))],v:dayRate(k)??0,k}});
  const weeks=[...Array(6)].map((_,w)=>{let a=0,b=0;for(let i=0;i<7;i++){const k=keyOf(addDays(now(),-(5-w)*7-i));const r=dayRate(k);if(r!=null){a+=r;b++}}return{l:w===5?'E hét':`${5-w} hete`,v:b?a/b:0}});

function moodChart(vals){const W=320,H=150,P=24,n=vals.length;const x=i=>P+i*(W-P*2)/(n-1||1),y=v=>H-P-(v-1)/4*(H-P*2);
  const pts=vals.map((v,i)=>v.v?[x(i),y(v.v)]:null).filter(Boolean);let d='';pts.forEach((p,i)=>{if(!i){d=`M${p[0]} ${p[1]}`;return}const q=pts[i-1],cx=(q[0]+p[0])/2;d+=`C${cx} ${q[1]} ${cx} ${p[1]} ${p[0]} ${p[1]}`});
  const area=pts.length?d+`L${pts[pts.length-1][0]} ${H-P}L${pts[0][0]} ${H-P}Z`:'';
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hangulat alakulása"><defs><linearGradient id="ma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBB7F7" stop-opacity=".45"/><stop offset="1" stop-color="#CBB7F7" stop-opacity="0"/></linearGradient></defs>${[1,2,3,4,5].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="2" y="${y(v)+4}" style="font-size:11px">${MOODS[5-v].e}</text>`).join('')}<path d="${area}" fill="url(#ma)"/><path d="${d}" fill="none" stroke="#A88EE6" stroke-width="2.4" stroke-linecap="round"/>${pts.length?`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="#A88EE6" style="stroke:var(--card)" stroke-width="2"/>`:''}${vals.map((v,i)=>n<=7||i%5===0?`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${n<=7?WD[wd(parseK(v.k))]:fmt(v.k,{month:'numeric',day:'numeric'})}</text>`:'').join('')}</svg>`}
function bars(data,id){const W=320,H=150,P=20,bw=Math.min(34,(W-P*2)/data.length*.55);const step=(W-P*2)/data.length;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Oszlopdiagram">${[0,.5,1].map(t=>`<line x1="${P}" x2="${W-P}" y1="${H-P-t*(H-P*2)}" y2="${H-P-t*(H-P*2)}" style="stroke:var(--line)"/>`).join('')}${data.map((d,i)=>{const h=Math.max(4,d.v*(H-P*2)),x=P+i*step+(step-bw)/2;const lab=d.t??Math.round(d.v*100)+'%';return`<g class="barr" data-a="barTip" data-t="${esc(d.l)}: ${lab}"><rect x="${x}" y="${H-P-(H-P*2)}" width="${bw}" height="${H-P*2}" rx="${bw/2.6}" style="fill:var(--track)" opacity=".55"/><rect x="${x}" y="${H-P-h}" width="${bw}" height="${h}" rx="${bw/2.6}" fill="${d.c||(i===data.length-1&&id==='d'?'#B9A2EE':'#D9CBFA')}"/><text x="${x+bw/2}" y="${H-P-h-6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${lab}</text><text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${esc(d.l)}</text></g>`}).join('')}</svg>`}
function lineChart(data){const W=320,H=140,P=22,n=data.length;const x=i=>P+i*(W-P*2)/(n-1),y=v=>H-P-v*(H-P*2);let d='';data.forEach((p,i)=>{d+=(i?'L':'M')+x(i)+' '+y(p.v)});

function sparkle(x,y,n=22){if(reduce)return;const fx=$('#fx');for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,r=50+Math.random()*90;s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${Math.random()*.3}s`;fx.appendChild(s);setTimeout(()=>s.remove(),1900)}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function badgeModal(b){$('#modal').innerHTML=`<div class="modal" data-a="closeModal"><div class="box" role="dialog" aria-label="Új jelvény"><div class="eyebrow">${b.got?'Új jelvény':'Hamarosan'}</div><div class="medal shine">${medal(b.tier,'big'+b.id)}</div><h2 style="font-size:24px">${b.n}</h2><p class="muted" style="margin-block:6px 18px">${b.d}${b.got?'. Új növény nyílt a kertedben.':` · még ${b.goal-b.v} hiányzik`}</p><button class="btn block" data-a="closeModal">Csodás</button></div></div>`;
  if(b.got){const r=$('#phone').getBoundingClientRect();setTimeout(()=>{sparkle(r.width/2,r.height/2-60,30);petalsFall(36)},250)}}

function initDrag(){const vb=$('#vb');if(!vb)return;let el=null;
  vb.querySelectorAll('.grip').forEach(g=>g.addEventListener('pointerdown',e=>{el=g.closest('.vc');el.classList.add('dragging');g.setPointerCapture(e.pointerId);e.preventDefault()}));
  vb.addEventListener('pointermove',e=>{if(!el)return;const t=document.elementFromPoint(e.clientX,e.clientY);const over=t&&t.closest('.vc[data-id]');if(over&&over!==el){const r=over.getBoundingClientRect();const after=(e.clientY-r.top)/r.height>.5||(e.clientX-r.left)/r.width>.5;vb.insertBefore(el,after?over.nextSibling:over)}});
  const end=()=>{if(!el)return;el.classList.remove('dragging');el=null;const ids=[...vb.querySelectorAll('.vc[data-id]')].map(x=>x.dataset.id);const rest=S.vision.filter(v=>!ids.includes(v.id));S.vision=[...ids.map(id=>S.vision.find(v=>v.id===id)),...rest];save();toast('Vision Board átrendezve')};
  vb.addEventListener('pointerup',end);vb.addEventListener('pointercancel',end)}

 favQ(){const q=QUOTES[Math.floor((now()-new Date(now().getFullYear(),0,0))/864e5)%QUOTES.length];S.favQuotes=S.favQuotes.includes(q)?S.favQuotes.filter(x=>x!==q):[...S.favQuotes,q];save();render(true);if(S.favQuotes.includes(q))toast('Hozzáadva az inspirációs gyűjteményhez')},
 cycleOn(){S.cycleOn=true;save();render();toast('Cikluskövetés bekapcsolva')},
 cycleToggle(){S.cycleOn=!S.cycleOn;save();render(true)},
 clen(el){S.cycle.length=Math.max(21,Math.min(40,S.cycle.length+ +el.dataset.v));save();render(true)},
 periodStart(){if(!S.cycle.starts.includes(TODAY)){S.cycle.starts=S.cycle.starts.filter(x=>dayDiff(TODAY,x)>10||x>TODAY);S.cycle.starts.push(TODAY);S.cycle.starts.sort()}S.cycle.days[TODAY]={sym:[],energy:0,...(S.cycle.days[TODAY]||{})};save();render(true);toast('Rögzítve. Vigyázz ma magadra 🤍')},
 energy(el){const d=S.cycle.days[TODAY]||{sym:[],energy:0};d.energy=+el.dataset.v;S.cycle.days[TODAY]=d;save();render(true)},
 sym(el){const d=S.cycle.days[TODAY]||{sym:[],energy:0};const v=el.dataset.v;d.sym=d.sym.includes(v)?d.sym.filter(x=>x!==v):[...d.sym,v];S.cycle.days[TODAY]=d;save();render(true)},
 vf(el){S.ui.vf=el.dataset.v;render(true)},
 vfav(el){const v=S.vision.find(x=>x.id===el.dataset.id);v.fav=!v.fav;save();render(true)},
 addVision(){draft={type:'quote',text:'',cat:'Önszeretet',img:null};visionSheet()},
 vset(el){const t=$('#vt');if(t)draft.text=t.value;draft[el.dataset.k]=el.dataset.v;visionSheet()},
 saveVision(){const t=$('#vt');draft.text=(t?t.value:draft.text).trim();if(draft.type==='img'&&!draft.img){toast('Válassz egy képet');return}if(!draft.text&&draft.type!=='img'){toast('Írd be a szöveget');return}if(!draft.text)draft.text='Álmaim';S.vision.unshift({...draft,id:uid(),when:draft.type==='reminder'?'Minden reggel 7:00':undefined});S.ui.vf='Mind';save();closeSheet();if(S.ui.sub!=='vision'){pushNav();S.ui.sub='vision'}render();toast('Felkerült a Vision Boardra ✨')},
 showBadge(el){badgeModal(allBadges().find(b=>b.id===el.dataset.id))},
 closeModal(el,e){if(e.target===el||el.classList.contains('btn'))$('#modal').innerHTML=''},
 ntog(el){S.notif[el.dataset.k]=!S.notif[el.dataset.k];save();render(true)},
 time(){},
 demoNotif(){toast(NOTIFS[Math.floor(Math.random()*4)])},
 saveProfile(){S.name=$('#nm').value.trim()||S.name;S.goal=$('#gl').value.trim()||S.goal;save();render(true);toast('Profil mentve')},
 theme(el){S.theme=el.dataset.v;save();applyTheme();render(true)},
 restartOb(){newOb();renderOb(1)},
 reset(el){if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Megerősítés';$('#resetMsg').textContent='Koppints újra a végleges törléshez.';return}try{localStorage.removeItem(SKEY)}catch(e){}S=seed();applyTheme();render();A.restartOb()},
 obNext(){readOb();if(ob.step===11){finishOb();return}ob.step++;renderOb(1);if(ob.step===11)setTimeout(()=>petalsFall(26),350)},
 obBack(){readOb();if(ob.step===0){if(S.onboarded)A.obClose();return}ob.step--;renderOb(-1)},
 obSec(){readOb();if(ob.step===8){ob.nm=false;ob.ne=false}ob.step++;renderOb(1)},
 obSkipStep(){readOb();if(ob.step===6)ob.cycle=false;if(ob.step===7)ob.mood=null;ob.step++;renderOb(1)},
 obClose(){$('#ob').innerHTML='';applyTheme()},
 obSkip(){const keep=S.onboarded?S.name:'Lili';newOb();Object.assign(ob,{sample:true,name:keep,areas:['health','soul','self'],goals:['Több energia napközben','Kevesebb stressz'],picks:TEMPLATES.filter((_,i)=>[0,1,2,3,4,5,8].includes(i)).map(t=>t.name),life:{health:7,self:6,rel:8,career:5,learn:6,money:4,hobby:5,soul:6},last:keyOf(addDays(now(),-24)),mood:1,planted:true});finishOb()},
 obArea(el){const v=el.dataset.v;ob.areas=ob.areas.includes(v)?ob.areas.filter(x=>x!==v):[...ob.areas,v];ob.picksInit=false;ob.lfs=null;renderOb()},
 obGoal(el){const v=el.dataset.v;if(ob.goals.includes(v))ob.goals=ob.goals.filter(x=>x!==v);else{if(ob.goals.length>=3){toast('Legfeljebb 3 célt választhatsz');return}ob.goals.push(v)}renderOb()},
 obGoalAdd(){const i=$('#obgc'),v=i&&i.value.trim();if(!v)return;if(ob.goals.length>=3&&!ob.goals.includes(v)){toast('Legfeljebb 3 célt választhatsz');return}if(!ob.goals.includes(v))ob.goals.push(v);renderOb()},
 obPick(el){const v=el.dataset.v;ob.picks=ob.picks.includes(v)?ob.picks.filter(x=>x!==v):[...ob.picks,v];renderOb()},
 obCycle(){readOb();ob.cycle=!ob.cycle;renderOb()},
 obClen(el){readOb();ob.clen=Math.max(21,Math.min(40,ob.clen+ +el.dataset.v));renderOb()},
 obMood(el){ob.mood=+el.dataset.v;renderOb()},
 obNotif(el){readOb();ob[el.dataset.k]=!ob[el.dataset.k];renderOb()},
 obTheme(el){readOb();ob.theme=el.dataset.v;S.theme=ob.theme;applyTheme();renderOb()},
 obFlower(el){ob.flower=el.dataset.v;renderOb()},
 obSample(){ob.sample=!ob.sample;renderOb()},
 lfSel(el){const v=el.dataset.v;if($('#ob').innerHTML){ob.lfs=v;renderOb()}else{S.ui.lfs=v;render(true)}},
 lfSave(){S.life.hist=S.life.hist.filter(h=>h.date!==TODAY);S.life.hist.push({date:TODAY,scores:{...S.life.scores}});save();render(true);toast('Életvirág elmentve 🌸')}
};
Object.assign(A,EXTRA_A);
function visionSheet(){const d=draft;openSheet(`<h2>Új elem a Vision Boardra</h2><p class="muted">Ami szem előtt van, az valósággá válik.</p>
 <div class="field"><span class="lbl">Típus</span><div class="seg">${[['img','Kép'],['quote','Idézet'],['goal','Cél'],['reminder','Emlékeztető']].map(([v,n])=>`<button class="${d.type===v?'on':''}" data-a="vset" data-k="type" data-v="${v}">${n}</button>`).join('')}</div></div>
 ${d.type==='img'?`<div class="field"><label for="vimg">Kép feltöltése</label><input class="inp" type="file" id="vimg" accept="image/*">${d.img?`<img src="${d.img}" alt="Előnézet" style="border-radius:18px;margin-top:8px;max-height:180px;object-fit:cover">`:''}</div>`:''}
 <div class="field"><label for="vt">${d.type==='img'?'Felirat':d.type==='quote'?'Idézet':d.type==='goal'?'Cél':'Emlékeztető'}</label><textarea class="inp" id="vt" maxlength="120" placeholder="${d.type==='goal'?'pl. Megtanulok olaszul':'Írd ide…'}">${esc(d.text)}</textarea></div>
 <div class="field"><span class="lbl">Kategória</span><div class="chips wrapchips">${['Önszeretet','Karrier','Egészség','Utazás','Kapcsolatok'].map(c=>`<button class="chip ${d.cat===c?'on':''}" data-a="vset" data-k="cat" data-v="${c}">${c}</button>`).join('')}</div></div>
 <div class="btns"><button class="btn" data-a="saveVision">Hozzáadás</button></div>`);
 const f=$('#vimg');if(f)f.addEventListener('change',()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const t=$('#vt');if(t)draft.text=t.value;draft.img=c.toDataURL('image/jpeg',.8);visionSheet()};im.src=rd.result};rd.readAsDataURL(file)})}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){if(el.dataset.a!=='closeModal')e.stopPropagation();fn(el,e)}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='time'){S.notif[e.target.dataset.k]=e.target.value;save();toast('Időpont mentve')}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sheet').classList.contains('on')||$('#modal').innerHTML){closeSheet();$('#modal').innerHTML=''}else if(!$('#ob').innerHTML&&(NAV.length||S.ui.sub||S.ui.tab!=='home'))A.back()}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();if($('#ob').innerHTML)A.obBack();else A.back()}});
/* Egér oldalsó „vissza” gombja */
document.addEventListener('mouseup',e=>{if(e.button===3){e.preventDefault();if($('#ob').innerHTML)A.obBack();else A.back()}});

/* ───────── Frissítés a felhőből ─────────
   Az Android app (BloomlyNative híd) a háttérben letölti az új verziót, majd szól; az exe minden indításkor magától frissít;
   a GitHub Pages címen futó webes változat mindig a legfrissebb. */
const UPD_BASE='https://kovacsanitacintia-del.github.io/bloomly-app/';
const APP_VER=(document.querySelector('meta[name="bloomly-version"]')||{}).content||'';
function verLabel(){const v=(window.BloomlyNative&&BloomlyNative.version&&BloomlyNative.version())||APP_VER;return /^\d{12,14}$/.test(v)?`Verzió: ${v.slice(0,4)}.${v.slice(4,6)}.${v.slice(6,8)}. ${v.slice(8,10)}:${v.slice(10,12)}`:'Fejlesztői változat'}
function updHint(){return window.BloomlyNative?'az app indításkor magától keres':/[?&]app=1/.test(location.search)?'az exe minden indításkor frissül':'a webes változat mindig a legfrissebb'}
window.bloomlyUpdateReady=v=>{$('#upd').innerHTML=`<div class="upd glass" role="status">${ic('sparkle')}<div class="grow"><b>Új Bloomly-verzió érkezett</b><small>Az adataid megmaradnak.</small></div><button class="btn" data-a="applyUpd">Frissítés</button><button class="iconbtn" data-a="laterUpd" aria-label="Később">${ic('close',16)}</button></div>`};
window.bloomlyUpToDate=()=>toast('A Bloomly naprakész ✨');
window.bloomlyUpdateFailed=()=>toast('Nem sikerült kapcsolódni. Próbáld újra később.');
Object.assign(A,{
 applyUpd(){$('#upd').innerHTML='';if(window.BloomlyNative)BloomlyNative.applyUpdate();else location.reload()},
 laterUpd(){$('#upd').innerHTML='';toast('A frissítés a következő indításkor is elérhető')},
 checkUpd(){if(window.BloomlyNative){toast('Frissítések keresése…');BloomlyNative.checkNow();return}
  fetch(UPD_BASE+'version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(APP_VER&&j.version>APP_VER){if(location.href.startsWith(UPD_BASE))bloomlyUpdateReady(j.version);else toast('Új verzió érhető el. Indítsd újra az alkalmazást.')}else bloomlyUpToDate()}).catch(()=>bloomlyUpdateFailed())}
});

/* Az Android vissza gombja ezt hívja: true, ha az app maga kezelte a visszalépést */
window.bloomlyBack=()=>{
  if($('#sheet').classList.contains('on')){closeSheet();return true}
  if($('#modal').innerHTML){$('#modal').innerHTML='';return true}
  if($('#ob').innerHTML){if(ob.step>0||S.onboarded){A.obBack();return true}return false}
  if(NAV.length||S.ui.sub||S.ui.tab!=='home'){A.back();return true}
  return false};
if(!S.fitness)seedExtras(S,true);
applyTheme();if(!S.vision.length)seedVision();render();if(!S.onboarded)renderOb();
</script>
